---
# yamllint disable rule:line-length
name: lint

on:
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    uses: ppat/github-workflows/.github/workflows/detect-changed-files.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      # yamllint disable-line rule:indentation
      files_yaml: |
        actions:
        - .github/workflows/**
        kubernetes:
        - 'best-practices/**/*.yaml'
        - 'pod-security-standard/**/*.yaml'
        markdown:
        - '**.md'
        - '!**/CHANGELOG.md'
        renovate:
        - .github/renovate.json
        - .github/renovate/**
        yaml:
        - '**.yaml'
        - '**.yml'
        zizmor:
        - .github/workflows/**
        - 'actions/**'
      git_ref: ${{ github.head_ref || github.ref }}

  commit-messages:
    if: ${{ github.event_name == 'pull_request' }}
    uses: ppat/github-workflows/.github/workflows/lint-commit-messages.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref }}
      # fetch_depth stays sized off pr.commits (total commits reachable in the PR):
      # the shallow-fetch generation depth needed to reach base.sha can never exceed
      # the number of unique commits between base and head, so this remains a safe
      # upper bound even though it isn't the same number as the commitlint range below.
      fetch_depth: ${{ github.event.pull_request.commits || 0 }}
      # Walk from the PR's actual merge base, not a first-parent `HEAD~N` hop count:
      # `~N` only follows first-parent history, but pr.commits counts every commit
      # reachable in the PR's diff (including ones brought in through merge commits),
      # so the two diverge whenever the branch's history isn't linear.
      from: ${{ github.event.pull_request.base.sha }}
      to: ${{ github.event.pull_request.head.sha || 'HEAD' }}

  github-actions:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).actions_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-github-actions.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).actions_all_changed_files }}

  kubernetes-manifests:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).kubernetes_any_changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
        persist-credentials: false

    - name: Format file list for validation
      id: format-files
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        changed_files="${{ github.event_name == 'pull_request' && fromJSON(needs.detect-changes.outputs.results).kubernetes_all_changed_files || '' }}"
        if [[ -n "$changed_files" ]]; then
          # Convert space-delimited string to a JSON array string
          echo "$changed_files" | tr ' ' '\n' | jq -R . | jq -s -c . > /tmp/files.json
          echo "files_json=$(cat /tmp/files.json)" >> "$GITHUB_OUTPUT"
        else
          echo "files_json=[]" >> "$GITHUB_OUTPUT"
        fi

    - name: Validate Kubernetes Manifests
      uses: ppat/validate-kubernetes-manifests@8d0eab3c27c0170576d933dc3da164f9fc56fd72 # v0.1.12
      with:
        files: ${{ steps.format-files.outputs.files_json }}
        pkg-include: '["best-practices/*","pod-security-standard/*"]'
        kubeconform-flags: '-skip=Secret,IPAddressPool'
        env-file: 'ci/validation/.env'
        base-kustomization-file: 'ci/validation/kustomization.yaml'
        debug: true

  markdown:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).markdown_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-markdown.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).markdown_all_changed_files }}

  pre-commit:
    uses: ppat/github-workflows/.github/workflows/lint-pre-commit.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}

  renovate-config-check:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).renovate_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-renovate-config-check.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).renovate_all_changed_files }}

  yaml:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).yaml_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-yaml.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
      files: ${{ github.event_name != 'pull_request' && 'ALL' || fromJSON(needs.detect-changes.outputs.results).yaml_all_changed_files }}

  zizmor:
    needs: [detect-changes]
    if: ${{ github.event_name != 'pull_request' || fromJSON(needs.detect-changes.outputs.results).zizmor_any_changed == 'true' }}
    uses: ppat/github-workflows/.github/workflows/lint-zizmor.yaml@5a96ced8ceefd58062f6b91ee9d6f3a31cd06e1c # v6.0.0
    with:
      git_ref: ${{ github.head_ref || github.ref }}
