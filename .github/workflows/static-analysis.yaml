---
# yamllint disable rule:line-length
# Static analysis that needs no live cluster -- distinct from lint.yaml (which only checks
# style/formatting via yamllint/markdownlint/commitlint/etc) and from e2e-tests.yaml (which
# stands up a real kind cluster). All jobs here run the Kyverno CLI with no cluster required
# against the policy YAML this repo ships:
#
# volume-types is a fixture-based behavioral test of one specific policy, restrict-volume-types,
# ported verbatim (fixtures and loop logic both) from the source repo this policy set was split
# out of -- see its own comments below for what it asserts and why.
#
# structural-smoke-check is a lightweight loader probe (`kyverno apply`) over every policy in the
# repo -- both the pure per-file YAML and, per design doc §8.1, the `kustomize build` output of
# each profile directory (built via ci/scripts/build-policies.sh, so exemption-patch CEL is
# compile-checked too, once patches exist) -- asserting only that each one still parses, is
# accepted by Kyverno's own CRD schema, and contains no CEL compile error. Not that it behaves
# any particular way against any resource. This is deliberately shallow. Deeper, fixture-based
# behavioral coverage for individual policies (in the style of volume-types below) is a later
# phase's job, not this baseline's.
#
# kyverno-test runs the `kyverno test` (CLI) tier -- cli.kyverno.io/v1alpha1 Test files under
# ci/policy-tests/kyverno/, recursively. Empty today (per-policy tests land with each ported
# policy); a no-op run is expected and must not fail the job.
name: static-analysis

on:
  pull_request:
    paths:
    - '.github/workflows/static-analysis.yaml'
    - 'best-practices/**/*.yaml'
    - 'pod-security-standard/**/*.yaml'
    - 'ci/policy-tests/**'
    - 'ci/scripts/build-policies.sh'
  schedule:
  - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  volume-types:
    # Pins what restrict-volume-types actually decides, in both directions. An allow-list is
    # only as good as what it still refuses, and what it refuses is only checked if something
    # goes red when it widens -- a fixture that passes tells you nothing on its own, because it
    # would also pass against a policy that had been deleted outright.
    #
    # So every fixture declares its expected outcome in its filename (-allowed / -denied) and
    # its header, and the suite is deliberately built so no fixture is vacuous:
    #
    #   * `image` is permitted for ordinary pods, asserted in two unrelated namespaces under two
    #     unrelated names, because the claim is that it is allowed GLOBALLY. One fixture cannot
    #     tell that apart from the name-and-namespace-scoped exclusion this policy used to carry.
    #   * hostPath is STILL denied for ordinary pods -- without this the suite cannot distinguish
    #     "we allowed `image`" from "we broke the policy", which is the whole reason the policy
    #     exists.
    #   * hostPath alongside a permitted `image` volume is still denied, catching an allow-list
    #     mis-edit that would read "if any key is allowed, pass".
    #   * the pre-existing virt-handler / virt-launcher exclusions still hold, and are still
    #     scoped by name AND namespace, asserted on hostPath rather than on `image` -- now that
    #     `image` is globally allowed, an `image`-based fixture for those pods would pass whether
    #     the exclusions existed or not. See pod-virt-launcher-hostpath-allowed.yaml.
    #
    # Runs the real policy file from pod-security-standard/restricted/, not a copy under ci/ --
    # the policy *is* the thing under test, so a copy would be the bug.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Kept in lockstep with the structural-smoke-check job below, for the same reason: the
      # CLI's policy engine should match the kyverno actually deployed by infra-security-core.
      # renovate: datasource=github-releases depName=kyverno/kyverno
      KYVERNO_CLI_VERSION: "v1.18.2"
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@9c16506c3c527478b6314c86ca961c0011d9f94a # v2.2.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          kyverno = "${{ env.KYVERNO_CLI_VERSION }}"

    - name: Assert restrict-volume-types allows image volumes and still denies hostPath
      working-directory: ./current
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        set -uo pipefail
        policy=pod-security-standard/restricted/restrict-volume-types.yaml
        fixtures=ci/policy-tests/fixtures/restrict-volume-types
        # `kyverno apply` exits 0 when nothing failed and 1 when a rule failed, and it does so
        # for validationFailureAction: Audit too -- verified, because "Audit means the CLI
        # can't fail" would silently turn every row below green. Note that exit 0 conflates two
        # different things: a pod that PASSES the rule (its volume types are all allow-listed)
        # and a pod that is EXCLUDED so the rule never evaluates. The -denied fixtures are what
        # distinguish those from "the policy no longer objects to anything".
        status=0
        for fixture in "${fixtures}"/*.yaml; do
          case "$(basename "${fixture}")" in
            *-allowed.yaml) want=0 ;;
            *-denied.yaml) want=1 ;;
            *) echo "::error::${fixture} declares no expected outcome in its filename"; status=1; continue ;;
          esac
          echo "::group::${fixture} (want exit ${want})"
          # `|| got=$?` is load-bearing, not a style tic -- do NOT "clean up" into a bare call
          # followed by `got=$?`. Actions invokes this step as `bash --noprofile --norc -e -o
          # pipefail`, and the `set -uo pipefail` above does not cancel that inherited `-e`.
          # A bare invocation therefore aborts the whole script on the first fixture that
          # exits non-zero -- which is precisely the -denied fixtures, whose *job* is to exit
          # non-zero. Measured: it killed the run mid-loop, so later fixtures never ran and
          # no `::error file=` was ever printed, and the job failed while the policy under
          # test was behaving perfectly. A guard rail that cannot run to completion, failing in
          # a way that looks exactly like the thing it guards being broken.
          # `|| got=$?` keeps `-e` on for every other command here while making this one
          # command's non-zero exit the data it is supposed to be.
          got=0
          mise exec -- kyverno apply "${policy}" --resource "${fixture}" --table --detailed-results --remove-color || got=$?
          echo "::endgroup::"
          if [ "${got}" -ne "${want}" ]; then
            echo "::error file=${fixture}::expected kyverno apply to exit ${want}, got ${got} -- restrict-volume-types no longer decides this pod the way its allow-list and exclusions say it should"
            status=1
          fi
        done
        exit "${status}"

  structural-smoke-check:
    # "Does every policy in the repo still parse and get accepted by Kyverno's own CRD schema,
    # with no CEL compile error" -- not "does it behave correctly" (that's volume-types above,
    # for the one policy that already has hand-written fixtures) and not a substitute for it.
    #
    # `kyverno apply` has no separate "just validate this policy" entrypoint (there is no
    # `kyverno validate` subcommand in this CLI version, and `kyverno apply <policy>` with no
    # `--resource` refuses to run at all: "Error: resource file(s) or cluster required"), so this
    # runs every policy individually against one shared, deliberately unremarkable
    # Pod (ci/policy-tests/smoke-resource.yaml) and inspects what the CLI says it loaded --
    # both the pure per-file policy YAML this repo ships, AND (per design doc §8.1) the
    # `kustomize build` output of each profile directory (ci/scripts/build-policies.sh), so
    # exemption-patch CEL is compile-checked too, once exemption patches exist.
    #
    # That "what it says it loaded" step is load-bearing and NOT optional: a malformed policy --
    # broken YAML, or YAML that fails Kyverno's own CRD schema -- is silently DROPPED by
    # `kyverno apply`, not rejected. It still prints "Applying 0 policy rule(s) to 1
    # resource(s)..." and exits 0. Verified locally against both a syntactically broken copy and
    # a schema-invalid copy (rules turned into a scalar instead of a list) of a real policy from
    # this repo: both produced that same "0 policy rule(s)" line and an EXIT 0, indistinguishable
    # from success by exit code alone. So this job never checks `kyverno apply`'s exit code -- a
    # real, non-excluded policy is expected to both Pass and Fail rules against an arbitrary
    # resource depending on what the resource looks like and which kind the policy targets (e.g.
    # a Service-scoped policy run against this job's Pod resource never matches at all), and none
    # of that is a structural problem.
    #
    # Two signals are trusted, neither the exit code:
    #   - the rule count `kyverno apply` reports it loaded from each file: for every legitimate
    #     policy in this repo (verified locally) that count is at least 1, so a count of 0 means
    #     the file was silently dropped, and a missing "Applying" line at all means the CLI
    #     errored out before getting that far.
    #   - any line matching `^Error:` in the CLI's own output. This is the fix for the CEL blind
    #     spot (design doc §4.2/§8.1): a `ValidatingPolicy`/`MutatingPolicy`/`DeletingPolicy` with
    #     a CEL compile error still reports "Applying 1 policy rule(s)" -- the rule count alone
    #     is coarser for the new kinds than it was for `ClusterPolicy` (it always reads 1
    #     regardless of how many `validations[]` a rule has), so the count check can no longer be
    #     trusted on its own to catch this failure class the way it could for the legacy kinds --
    #     but the CLI also emits a distinct `Error:` line for a compile error, which the count
    #     check doesn't see. Deliberately narrower than trusting exit code (a policy that
    #     legitimately Fails the smoke resource also exits non-zero) but exact for this class.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Kept in lockstep with the volume-types job above, for the same reason: the CLI's policy
      # engine should match the kyverno actually deployed by infra-security-core.
      # renovate: datasource=github-releases depName=kyverno/kyverno
      KYVERNO_CLI_VERSION: "v1.18.2"
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@9c16506c3c527478b6314c86ca961c0011d9f94a # v2.2.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          kyverno = "${{ env.KYVERNO_CLI_VERSION }}"
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
          kustomize = "5.8.1"
          # renovate: datasource=github-releases depName=mikefarah/yq
          yq = "4.53.6"

    - name: Build policy profiles (ci/scripts/build-policies.sh)
      working-directory: ./current
      shell: bash
      run: mise exec -- ./ci/scripts/build-policies.sh

    - name: Assert every policy still loads, with no CEL compile error (Kyverno CLI, no cluster required)
      working-directory: ./current
      shell: bash
      # yamllint disable-line rule:indentation
      run: |
        set -uo pipefail
        resource=ci/policy-tests/smoke-resource.yaml
        status=0
        # Pure per-file policy YAML this repo ships, plus the built output of every profile
        # directory -- see the job comment above for why both are probed.
        mapfile -t policies < <(find best-practices pod-security-standard -type f -name '*.yaml' ! -name 'kustomization.yaml' | sort)
        mapfile -t built < <(find ci/policy-tests/.build -type f -name '*.yaml' | sort)
        policies+=("${built[@]}")
        echo "Found ${#policies[@]} policies to probe (${#built[@]} from built profile output)..."
        for policy in "${policies[@]}"; do
          echo "::group::${policy}"
          # `|| true` is load-bearing here for the same reason it's `|| got=$?` in volume-types
          # above: Actions runs this step under an inherited `set -e`, and a policy whose rules
          # Fail against the shared smoke resource is an entirely expected outcome (this resource
          # is not written to comply with anything), not a script error. Unlike volume-types,
          # this job never inspects that exit code at all -- see the job-level comment above for
          # why rule count and the `^Error:` check, not exit code, are what's actually asserted.
          output=$(mise exec -- kyverno apply "${policy}" --resource "${resource}" --table --detailed-results --remove-color 2>&1) || true
          echo "${output}"
          echo "::endgroup::"
          rule_count=$(grep -oE 'Applying [0-9]+ policy rule\(s\)' <<<"${output}" | grep -oE '[0-9]+' || true)
          if [[ -z "${rule_count}" || "${rule_count}" -eq 0 ]]; then
            echo "::error file=${policy}::kyverno apply reported loading 0 policy rule(s) from this file (or errored out before reporting at all). A malformed policy is silently DROPPED by the CLI, not rejected -- it still exits 0 -- so a rule count of 0 here means this file did not load, not that it has nothing to say about the probe resource."
            status=1
          fi
          if grep -qE '^Error:' <<<"${output}"; then
            echo "::error file=${policy}::kyverno apply reported an Error: line -- this is the CEL-compile-error signal a rule count alone cannot see (a policy with a CEL compile error still reports 'Applying 1 policy rule(s)' for the new policies.kyverno.io kinds), not a resource that merely failed the probe Pod's rules"
            status=1
          fi
        done
        exit "${status}"

  kyverno-test:
    # The `kyverno test` (CLI) tier: cli.kyverno.io/v1alpha1 Test files under
    # ci/policy-tests/kyverno/, mirroring the policy tree by profile and policy name. Empty
    # today -- per design doc §8.3, "the harness cannot come after the translation", so this
    # scaffolding lands before any policy is ported; per-policy tests then land *with* each
    # ported policy in a later PR, not later in time. `kyverno test` recursively discovers
    # `kyverno-test.yaml` files under the given path and exits 0 with "No test yamls available"
    # when it finds none (verified locally against this repo's currently-empty tree), so this
    # step is a legitimate no-op today rather than a failure waiting to happen.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Kept in lockstep with the jobs above, for the same reason: the CLI's policy engine
      # should match the kyverno actually deployed by infra-security-core.
      # renovate: datasource=github-releases depName=kyverno/kyverno
      KYVERNO_CLI_VERSION: "v1.18.2"
    steps:
    - name: Setup repository and tools
      uses: ppat/homelab-ops-actions/actions/setup-repository-tools@9c16506c3c527478b6314c86ca961c0011d9f94a # v2.2.0
      with:
        current_git_ref: ${{ github.head_ref || github.ref }}
        current_repository: ${{ github.repository }}
        token: ${{ secrets.GITHUB_TOKEN }}
        mise_toml: |
          [tools]
          kyverno = "${{ env.KYVERNO_CLI_VERSION }}"

    - name: Run kyverno test
      working-directory: ./current
      shell: bash
      run: mise exec -- kyverno test ci/policy-tests/kyverno
