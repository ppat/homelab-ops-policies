---
# PROVENANCE: this repo's own legacy `kyverno.io/v1 ClusterPolicy`, translated in place. Upstream
# kyverno/policies carries a `MutatingPolicy` form at other-mpol/add-emptydir-sizelimit/ (read at
# commit d84f18c9); its `ApplyConfiguration` skeleton is adopted, its BEHAVIOUR is rejected on two
# counts, both re-read from the upstream file rather than taken on trust:
#
#   1. Upstream patches a sizeLimit onto EVERY emptyDir, memory-backed ones included. A
#      `sizeLimit` on a `medium: Memory` emptyDir is not a disk quota -- it caps a tmpfs whose
#      pages are charged to the Pod's memory, so it is a second, invisible memory limit on the
#      workload. Applying disk-shaped reasoning to a memory-backed volume is how this policy turns
#      into an OOM source.
#   2. Upstream replaced the "already has a sizeLimit" guard with a read-back
#      (`has(v.emptyDir.sizeLimit) ? v.emptyDir.sizeLimit : "100Mi"`). That preserves the VALUE but
#      still rewrites the field on every emptyDir in the cluster and still emits a patch for Pods
#      that needed none. This file keeps the real guard.
#
# The default is 256Mi here and 100Mi upstream. 256Mi is the estate's number and is the policy; do
# not "sync with upstream".
#
# LAYER 1: this file is exemption-free. The `matchConditions` entry below is RULE SEMANTICS, not an
# exemption -- every exemption this policy has in production, including the one the eviction-loop
# incident earned, lives in ./exemptions/add-emptydir-sizelimit.yaml, appended to
# `spec.matchConditions` by the `patches:` entry in ./kustomization.yaml. Read the two together.
#
# House style is set by ./restrict-node-port.yaml; see ./add-default-resources.yaml for what a
# mutate policy adds on top of it, including why a wrong one is worse than a wrong validate policy.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-emptydir-sizelimit
  annotations:
    policies.kyverno.io/title: Add emptyDir sizeLimit
    policies.kyverno.io/category: Mutations
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      When a Pod requests an emptyDir, by default it does not have a size limit which
      may allow it to consume excess or all of the space in the medium backing the volume.
      This can quickly overrun a Node and may result in a denial of service for other
      workloads. This policy adds a sizeLimit field to all Pods mounting emptyDir
      volumes, if not present, and sets it to 256Mi.
spec:
  autogen:
    podControllers:
      # `[]` on every Pod-matching policy in this repo; ./add-default-resources.yaml records the
      # measurement behind it once. For THIS policy the pin is not cosmetic: its virt-launcher
      # exemption is metadata-based, and an autogen rewrite that left such an exemption no longer
      # matching would re-arm the eviction loop ./exemptions/add-emptydir-sizelimit.yaml describes.
      #
      # (What chart 3.8.2 actually generates, for whoever revisits this: `object.spec.*` IS
      # rewritten to `object.spec.template.spec.*` while `object.metadata.*` is left alone, which
      # would be the correct behaviour. The hazard above was measured on a `ValidatingPolicy`; do
      # not assume it reproduces here without re-measuring.)
      controllers: []
  evaluation:
    background:
      # OFF ON EVERY MUTATE POLICY IN THIS REPO -- ./add-default-resources.yaml states the reasoning
      # once. Here it is the eviction loop that makes it concrete: a background re-scan applies this
      # cap to emptyDirs on Pods that are already running, which is exactly the situation
      # ./exemptions/add-emptydir-sizelimit.yaml describes, minus the admission request that would
      # have let anyone see it happen.
      enabled: false
    mutateExisting:
      enabled: false
  matchConditions:
  # RULE SEMANTICS, not an exemption, and the policy-wide half of a pair: this answers "is there
  # anything here to do at all", while the `filter()` inside the mutation decides which volumes.
  # Both are needed and they must be edited together.
  #
  # Measured on the pinned CLI without this condition: a Pod with no volumes comes out of the
  # mutation carrying `volumes: []`, because the `ApplyConfiguration` expression always constructs
  # a (possibly empty) list. That is a gratuitous rewrite of nearly every Pod admitted to the
  # cluster, with no report anywhere to surface it. With the condition the same Pod is `skip`ped
  # and its object is not touched.
  - name: only-when-an-uncapped-disk-backed-emptydir-is-present
    expression: >-
      object.spec.?volumes.orValue([]).exists(v, has(v.emptyDir) &&
      v.emptyDir.?sizeLimit.orValue('') == '' &&
      v.emptyDir.?medium.orValue('') != 'Memory')
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  mutations:
  - patchType: ApplyConfiguration
    applyConfiguration:
      # `ApplyConfiguration`, not `JSONPatch`, and the choice is load-bearing. The legacy rule used
      # `patchesJson6902` with a POSITIONAL `/spec/volumes/{{elementIndex}}/` pointer that Kyverno's
      # `foreach` indexed for it; CEL has no index-carrying iteration, so a JSONPatch port would
      # reconstruct indices by hand and then depend on a list order another mutating webhook may
      # have changed. `spec.volumes` is `listType: map` keyed on `name`, so this form matches by
      # name instead: one entry per volume that needs a sizeLimit, every other volume and every
      # other field of the volumes it touches left exactly as it was.
      #
      # THE `filter()` IS THE POLICY. Its three conjuncts, in order:
      #   * `has(v.emptyDir)` -- a configMap or PVC volume is not this policy's business and must
      #     not gain an `emptyDir` key.
      #   * `sizeLimit == ''` -- DO NOT OVERWRITE A DELIBERATELY-SET LIMIT. An author who wrote
      #     `sizeLimit: 8Gi` meant it; replacing it with 256Mi evicts them, silently.
      #   * `medium != 'Memory'` -- DO NOT APPLY DISK-SHAPED REASONING TO A tmpfs. See the header.
      # Upstream's mpol has neither of the last two as guards. Each has a firing fixture in
      # ci/policy-tests/kyverno/best-practices/add-emptydir-sizelimit/ and a live case in the
      # Chainsaw test, because a guard with no fixture is a guard that can be deleted by accident.
      #
      # `object.spec.volumes` is dereferenced without `.?`, unlike everywhere else in this repo,
      # because the `matchConditions` gate above has already established that the field exists and
      # holds a qualifying volume.
      expression: >-
        Object{spec: Object.spec{volumes: object.spec.volumes.filter(v, has(v.emptyDir) &&
        v.emptyDir.?sizeLimit.orValue('') == '' && v.emptyDir.?medium.orValue('') != 'Memory')
        .map(v, Object.spec.volumes{name: v.name,
        emptyDir: Object.spec.volumes.emptyDir{sizeLimit: '256Mi'}})}}
