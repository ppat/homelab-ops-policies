---
# PROVENANCE: hand-authored. Upstream kyverno/policies ships its own `DeletingPolicy` rewrite of
# this policy (best-practices-dpol/cleanup-bare-pods/), deliberately not followed: it schedules
# `*/5`, polling suited to upstream's own demo and test cycle rather than to a cluster where a
# bare Pod surviving a few extra hours costs nothing.
#
# House style is set by ./restrict-node-port.yaml; read its header first. The
# `DeletingPolicy`-specific traps -- the `spec.conditions` field name, and the `resourceFilters`
# ConfigMap -- are written up in ./cleanup-empty-replicasets.yaml, this repo's fuller reference
# for the kind. Read that before writing another one.
#
# No estate exemption applies here: there is no ./exemptions/cleanup-bare-pods.yaml and no
# `patches:` entry targeting this policy, so what this file says is all of what gets applied.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-bare-pods
  annotations:
    policies.kyverno.io/title: Cleanup Bare Pods
    policies.kyverno.io/category: Cleanup
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # `policies.kyverno.io/v1 DeletingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      A bare Pod is any Pod created directly and not owned by a controller such as a
      Deployment or Job. Bare Pods are often create manually by users in an attempt to troubleshoot
      an issue. If left in the cluster, they create clutter, increase cost, and can be a security
      risk. Bare Pods can be cleaned up periodically through use of a policy. This policy finds
      and removes all bare Pods across the cluster at 5am UTC daily.
spec:
  schedule: "0 5 * * *"
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      # INERT ON THIS KIND, and optional in the CRD. The cleanup controller's periodic
      # LIST-then-delete cycle considers every existing object the rules match, whenever it was
      # created -- a Pod predating this policy is picked up on the next cycle just the same.
      # This field cannot scope a cleanup by lifecycle event; nothing reads it here.
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  conditions:
  - name: has-no-owner
    expression: object.metadata.?ownerReferences.orValue([]).size() == 0
