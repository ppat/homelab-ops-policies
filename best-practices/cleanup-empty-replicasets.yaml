---
# PROVENANCE: hand-authored. Upstream kyverno/policies' own `DeletingPolicy` rewrite of this
# policy drops the 24h age guard kept below. That guard is what makes this policy safe to run
# hourly: a Deployment mid-rollout, or one that has just finished, leaves behind exactly the
# shape this policy targets -- an empty ReplicaSet -- and deleting it destroys
# `kubectl rollout undo` for that revision.
#
# House style is set by ./restrict-node-port.yaml; read its header first. This file is also the
# repo's `DeletingPolicy` reference, for the two things about the kind that cost real time:
#
#   1. `DeletingPolicy.spec` HAS NO `matchConditions` FIELD. The `ValidatingPolicy`/
#      `MutatingPolicy` field of that name does not carry over; the equivalent is
#      `spec.conditions[]`, same `{name, expression}` item shape. It does not fail quietly -- the
#      CRD is structural with strict decoding, so the apiserver rejects the whole object:
#      `strict decoding error: unknown field "spec.matchConditions"`.
#   2. `resourceFilters` IN THE `kyverno` CONFIGMAP, NOT THIS POLICY, IS THE USUAL REASON THIS
#      POLICY DOES NOTHING. The Kyverno chart's DEFAULT value carries `[ReplicaSet,*,*]` and
#      `[ReplicaSet/?*,*,*]`, which exclude ReplicaSets from every Kyverno engine -- admission
#      and background/cleanup alike -- upstream of and independent of anything written below.
#      Measured: an unconditional DeletingPolicy over all `apps/v1` ReplicaSets, with correct
#      RBAC and a LIST returning real items, never reaches the cleanup controller's per-object
#      delete path until those two entries are gone. Pods and Deployments are not
#      blanket-filtered this way, which is why ./cleanup-bare-pods.yaml needs none of this.
#
#      CONSUMER OBLIGATION THIS REPO CANNOT DISCHARGE: a consuming estate's Kyverno values must
#      override `resourceFilters` to drop those entries, or this policy has never deleted
#      anything there. This repo's own Chainsaw cluster carries that override
#      (.github/workflows/e2e-tests.yaml), which is what lets the live tier exercise the policy
#      at all.
#
# The `kube-system` exclusion below stays in the policy rather than moving to ./exemptions/:
# CLAUDE.md draws that line at universality, and every consumer needs it. The exemptions/ layer
# is for carve-outs that only one consumer's environment justifies.
apiVersion: policies.kyverno.io/v1
kind: DeletingPolicy
metadata:
  name: cleanup-empty-replicasets
  annotations:
    policies.kyverno.io/title: Cleanup Empty ReplicaSets
    policies.kyverno.io/category: Cleanup
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: ReplicaSet
    # `policies.kyverno.io/v1 DeletingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      ReplicaSets serve as an intermediate controller for various Pod controllers like Deployments. When
      a new version of a Deployment is initiated, it generates a new ReplicaSet with the specified number
      of replicas and scales down the current one to zero. Consequently, numerous empty ReplicaSets may
      accumulate in the cluster, leading to clutter and potential false positives in policy reports if
      enabled. This cleanup policy is designed to remove empty ReplicaSets across the cluster within a
      specified timeframe, for instance, ReplicaSets created one day ago, ensuring the ability to rollback
      to previous ReplicaSets in case of deployment issues
spec:
  schedule: "0 * * * *"
  matchConstraints:
    # Defence in depth, not the only guard: `resourceFilters` (header point 2) already excludes
    # `kube-system` cluster-wide via `[*/*,kube-system,*]`.
    #
    # `kubernetes.io/metadata.name` is also the only namespaceSelector key the offline
    # `kyverno test` tier can decide -- it derives that label from the resource's own
    # `metadata.namespace` with no Namespace object present, and reports any other key as simply
    # absent. A selector keyed on a real Namespace label would go silently untested there.
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      # Inert on this kind -- see ./cleanup-bare-pods.yaml.
      operations:
      - CREATE
      - UPDATE
      resources:
      - replicasets
  conditions:
  - name: is-empty
    expression: object.spec.?replicas.orValue(1) == 0
  - name: is-old-enough
    expression: timestamp(object.metadata.creationTimestamp) < time.now() - duration('24h')
