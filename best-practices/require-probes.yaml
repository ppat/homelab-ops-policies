---
# PROVENANCE: hand-authored. Upstream kyverno/policies has a `ValidatingPolicy` for this rule
# (read at commit ef9843f0) from which exactly one thing is adopted -- the container-naming
# `messageExpression` on `validations` below. The rest of that file is rejected: it keeps autogen
# ON *and* lists pods, all seven pod controllers, jobs and cronjobs in `matchConstraints`, and
# ships `validationActions: [Deny]`.
#
# LAYER 1: this file is exemption-free. Every exemption this policy has in production lives in
# ./exemptions/require-probes.yaml, appended to `spec.matchConditions` by the `patches:` entry in
# ./kustomization.yaml. Read the two together before concluding this policy has no exemptions.
#
# House style for a `best-practices`-group `ValidatingPolicy` is set by ./restrict-node-port.yaml;
# read that file first. Its numbered conventions apply here unrestated, including
# `spec.autogen.podControllers.controllers: []`.
#
# ACCEPTED SCOPE: matching the three controller kinds and not `pods` leaves an unprobed BARE Pod
# unflagged. That is deliberate -- bare pods here are troubleshooting artefacts rather than
# workloads (./cleanup-bare-pods.yaml deletes them daily), and probes on one would be noise.
#
# NATIVE-SIDECAR GAP: this policy checks `containers` only, so a native sidecar (an
# `initContainer` with `restartPolicy: Always`) goes unchecked even though a probe suits it just
# as well. That is a CHOICE, not an oversight; extending it would change which workloads appear in
# the audit stream, which is its own change to argue for and measure.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Pod Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Deployment, DaemonSet, StatefulSet
    policies.kyverno.io/description: >-
      Liveness and readiness probes need to be configured to correctly manage a Pod's
      lifecycle during deployments, restarts, and upgrades. For each Pod, a periodic
      `livenessProbe` is performed by the kubelet to determine if the Pod's containers
      are running or need to be restarted. A `readinessProbe` is used by Services
      and Deployments to determine if the Pod is ready to receive network traffic.
      This policy validates that all containers have one of livenessProbe, readinessProbe,
      or startupProbe defined.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  # The append seam for ./exemptions/require-probes.yaml. Declared even though empty: a JSON6902
  # `op: add` onto `/spec/matchConditions/-` fails the kustomize build when the parent is absent.
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - daemonsets
      - deployments
      - statefulsets
  validationActions:
  - Audit
  validations:
  - expression: >-
      variables.containers.all(container,
      has(container.livenessProbe) ||
      has(container.readinessProbe) ||
      has(container.startupProbe))
    # Under Audit every finding is a PolicyReport row read later with no access to the object that
    # produced it, so naming the offending containers is the difference between a row that can be
    # acted on and one that starts an investigation.
    messageExpression: >-
      'Liveness, readiness, or startup probes are required for all containers. Containers with no probe: ' +
      variables.containers.filter(container,
      !(has(container.livenessProbe) ||
      has(container.readinessProbe) ||
      has(container.startupProbe))).map(container, container.name).join(', ')
  variables:
  # NO NULL GUARD, deliberately. Both `spec.template` and `spec.template.spec.containers` are
  # required by the schema of all three matched kinds, and an `.orValue()` here would silently
  # swallow a future `matchConstraints` entry for a kind shaped differently instead of failing
  # loudly. See the header for why `containers` and not all three container lists.
  - name: containers
    expression: object.spec.template.spec.containers
