---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check hostPorts
#
# LAYER 1 PURE MIRROR. The conventions are stated once, in best-practices/restrict-node-port.yaml
# and ../restricted/restrict-volume-types.yaml; this file follows them.
#
# Estate exemptions live in exemptions/disallow-host-ports.yaml, appended to
# `spec.matchConditions` by kustomization.yaml. Read the two together.
#
# check_hostPorts.go is a single versioned check (MinimumVersion 1.0), untouched since k8s 1.22:
# any non-zero hostPort is refused, and no port-range nuance exists at any policy version.
# Kyverno's `disallow-host-ports-range` is a convenience sitting outside the standard; this file
# mirrors the standard, so that variant is deliberately not carried.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow hostPorts
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Access to host ports allows potential snooping of network traffic and should not be
      allowed, or at minimum restricted to a known list. This policy ensures the `hostPort`
      field is unset or set to `0`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
    message: >-
      Use of host ports is disallowed. The fields spec.containers[*].ports[*].hostPort
      , spec.initContainers[*].ports[*].hostPort, and spec.ephemeralContainers[*].ports[*].hostPort
      must either be unset or set to `0`.
