---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check hostPorts
#
# LAYER 1 PURE MIRROR (design doc phase2.0-policy-migration-design-v3.md §2.1). House style is
# set by best-practices/restrict-node-port.yaml and ../restricted/restrict-volume-types.yaml --
# read those headers first; this file follows their conventions without restating them.
#
# Estate exemptions for this policy live in exemptions/disallow-host-ports.yaml, applied via the
# `patches:` entry in kustomization.yaml (design §2.2).
#
# check_hostPorts.go: one VersionedCheck at MinimumVersion 1.0, unchanged since k8s 1.22. Any
# non-zero hostPort on any container/initContainer/ephemeralContainer is forbidden; allowed values
# are undefined or 0. No range-based nuance exists anywhere in the standard (design §5.9 --
# upstream's `disallow-host-ports-range` is a non-PSS convenience, deliberately not chased).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-ports
  annotations:
    policies.kyverno.io/title: Disallow hostPorts
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Access to host ports allows potential snooping of network traffic and should not be
      allowed, or at minimum restricted to a known list. This policy ensures the `hostPort`
      field is unset or set to `0`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?ports.orValue([]).all(p, p.?hostPort.orValue(0) == 0))
    message: >-
      Use of host ports is disallowed. The fields spec.containers[*].ports[*].hostPort
      , spec.initContainers[*].ports[*].hostPort, and spec.ephemeralContainers[*].ports[*].hostPort
      must either be unset or set to `0`.
