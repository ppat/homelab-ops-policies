---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check
# hostProbesAndHostLifecycle
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape, CEL
# conventions) and ../restricted/restrict-volume-types.yaml (the PSS-mirror family conventions).
#
# THE ONE POLICY HERE WITH NO UPSTREAM `kyverno/policies` EQUIVALENT in any variant. It is
# hand-authored from `check_hostProbesAndhostLifecycle.go` on release-1.36 -- the newest Baseline
# control, added at PSS policy version 1.34 (kubernetes/kubernetes PR #125271) and gated by
# nothing but the policy version. There is nothing to diff it against except that Go
# file, so the validations below are written to line up with its "Restricted Fields" doc comment
# one path at a time rather than to be compact.
#
# WHAT THE CONTROL IS FOR, since "a probe with a host field" does not obviously read as a
# security problem: the kubelet performs probe and lifecycle-hook calls FROM THE NODE, not from
# the pod. A `.host` therefore turns a pod spec into a kubelet-sourced request primitive that
# reaches anything the node reaches -- other nodes' kubelets, a cloud metadata endpoint, a
# management network the pod's own NetworkPolicy has no say over -- from an identity that is not
# the pod's. Without `.host` the kubelet dials the pod's own IP, which is the intended shape.
#
# EXPECT THIS POLICY TO PRODUCE AUDIT ROWS ON A REAL CLUSTER, and do not read them as a defect.
# `hostNetwork: true` DaemonSets commonly pin a probe to loopback so the kubelet does not dial
# the node's routable address -- csi-driver-nfs's node and controller charts and metallb's
# `speaker`/`frr-k8s` all do -- and that is the benign end of this control's range. PSS makes no
# such distinction: `getForbiddenHostProbes()` tests `Host != ""` and nothing more, and a
# faithful mirror must not invent a loopback carve-out. Under Audit that faithfulness is nearly
# free, the cost being accurate rows saying those pods deviate from PSS Baseline, which they do.
# Quietening the stream is a deliberate decision, not a default: it takes an
# exemptions/disallow-host-probes-and-lifecycle.yaml plus a `patches:` entry in
# ../kustomization.yaml, scoped and carrying its own rationale. Hence no exemption here.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-probes-and-lifecycle
  annotations:
    policies.kyverno.io/title: Disallow Host Probes and Lifecycle Hooks
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    # A cluster pinned below PSS policy version 1.34 does not run this check at all -- worth
    # knowing when comparing this repo's findings against a real PodSecurity admission plugin's.
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      The kubelet performs probe and lifecycle-hook requests from the node rather than from the
      Pod, so a `host` field on one of them reaches whatever the node can reach, from an identity
      that is not the Pod's. This policy ensures the `host` field is unset or empty on every
      liveness, readiness and startup probe and on every postStart and preStop lifecycle hook.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # TWO VALIDATIONS, PROBES AND HOOKS, rather than one combined expression or ten small ones.
  # The split follows the check's own two helper functions (`getForbiddenHostProbes()` and
  # `getForbiddenHostLifecycle()`) and buys a distinguishable message per channel -- `kyverno
  # apply` emits one row per POLICY, not per validation, so the message is the only signal that
  # says which half fired.
  #
  # EVERY PATH IS SPELLED OUT rather than factored through `spec.variables` or a helper. With no
  # upstream text and no other rule to diff against, the only available correctness check is
  # reading this beside the Go file's own "Restricted Fields" list, and the explicit conjuncts
  # line up with that list one-for-one. A compressed form would be shorter and strictly harder to
  # audit, which is the wrong trade for this policy specifically.
  #
  # `.orValue('')` on the leaf reproduces the check's `Host != ""` test exactly: PSS treats an
  # ABSENT host and an EMPTY host identically ("Allowed Values: '', undefined/null" in its doc
  # comment), and the optional chain means an absent probe, an absent handler, or an `exec`/`grpc`
  # handler -- none of which has a host field at all -- simply yields ''.

  # PROBES: three probe types x two handler types, over all three container lists.
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?livenessProbe.?httpGet.?host.orValue('') == '' &&
      c.?livenessProbe.?tcpSocket.?host.orValue('') == '' &&
      c.?readinessProbe.?httpGet.?host.orValue('') == '' &&
      c.?readinessProbe.?tcpSocket.?host.orValue('') == '' &&
      c.?startupProbe.?httpGet.?host.orValue('') == '' &&
      c.?startupProbe.?tcpSocket.?host.orValue('') == '')
    message: >-
      Setting a host on a probe is not allowed. The fields
      spec.containers[*].{liveness,readiness,startup}Probe.{httpGet,tcpSocket}.host,
      and the same fields on spec.initContainers[*] and spec.ephemeralContainers[*],
      must be unset or empty.

  # LIFECYCLE HOOKS: two hook types x two handler types, over all three container lists.
  #
  # `tcpSocket` is included because the API and the PSS check both still carry it, even though a
  # TCPSocket handler has never actually been supported as a LifecycleHandler -- the Go file's
  # own doc comment marks those four paths "Deprecated. TCPSocket is NOT supported as a
  # LifecycleHandler and kept for backward compatibility". A mirror follows the check, not the
  # subset of it that does something.
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?lifecycle.?postStart.?httpGet.?host.orValue('') == '' &&
      c.?lifecycle.?postStart.?tcpSocket.?host.orValue('') == '' &&
      c.?lifecycle.?preStop.?httpGet.?host.orValue('') == '' &&
      c.?lifecycle.?preStop.?tcpSocket.?host.orValue('') == '')
    message: >-
      Setting a host on a lifecycle hook is not allowed. The fields
      spec.containers[*].lifecycle.{postStart,preStop}.{httpGet,tcpSocket}.host,
      and the same fields on spec.initContainers[*] and spec.ephemeralContainers[*],
      must be unset or empty.
