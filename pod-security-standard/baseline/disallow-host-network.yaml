---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check hostNamespaces
#
# House style is set by ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape and
# CEL conventions) and by ../restricted/restrict-volume-types.yaml (the PSS-mirror family: the
# `PSS-SNAPSHOT:` marker, the empty `matchConditions` seam, `autogen.podControllers.controllers:
# []`, and the dropped `preconditions` block). Read those two headers first; nothing they say is
# restated here.
#
# ONE OF THREE FILES REPLACING THE LEGACY `disallow-host-namespaces` ClusterPolicy, which carried
# three rules (`host-network-namespaces`, `host-pid-namespaces`, `host-ipc-namespaces`) with
# THREE DIFFERENT `exclude:` blocks. The split into disallow-host-network.yaml,
# disallow-host-pid.yaml and disallow-host-ipc.yaml is design doc
# phase2.0-policy-migration-design-v3.md §2.3, and the reason is structural rather than
# cosmetic: `spec.matchConditions` is POLICY-WIDE on a `ValidatingPolicy`, so three per-rule
# exclusion sets cannot survive in one policy without being pushed back inside the validation
# expressions -- which is exactly the layering the migration exists to undo (§2.1/§2.2). Keeping
# them joined would also silently WIDEN each rule's exemptions to the other two: `csi-driver-nfs`
# and `metallb-system` are exempt from THIS check only, and virt-handler is exempt from the
# hostPID check only.
#
# What the split costs, recorded once here rather than in all three files: three PolicyReport
# policy names replace one. Nothing consumes those names programmatically, this repo is
# Audit-mode, and a kind migration is the only cheap moment to rename a report key -- the same
# trade ../../best-practices/restrict-node-port.yaml makes for `restrict-nodeport`.
#
# PSS's own check granularity is NOT a constraint on this: pod-security-admission implements all
# three fields in a single `hostNamespaces` check, but that is its internal bookkeeping (one
# CheckResult, one ForbiddenDetail string). Fidelity means the same admission decision on the
# same pod, which the three files reproduce exactly.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-network
  annotations:
    policies.kyverno.io/title: Disallow Host Network Namespace
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # Bumped from the legacy file's `kyverno.io/kyverno-version: 1.6.0`, which is dropped as
    # redundant with this key: `policies.kyverno.io/v1 ValidatingPolicy` is first served by
    # Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Was "1.22-1.23" on the legacy ClusterPolicy. This file is a fresh mirror taken at the
    # snapshot named at the top, so the annotation moves with it.
    kyverno.io/kubernetes-version: "1.36"
    # Narrowed from the legacy three-namespace description to this policy's one field. The
    # sibling files carry the corresponding halves.
    policies.kyverno.io/description: >-
      The host network namespace allows access to shared information and can be used to
      elevate privileges. Pods should not be allowed access to it. This policy ensures the
      field which makes use of the host network namespace is unset or set to `false`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # `spec.hostNetwork` is optional and defaults to false, so the null-safe form is a comparison
  # against the API's own default. Translated from the legacy JMESPath conditional-anchor pattern
  # `=(hostNetwork): "false"` ("if the field is present it must be false"), which has identical
  # semantics: absent passes, false passes, true fails.
  - expression: >-
      !object.spec.?hostNetwork.orValue(false)
    message: >-
      Sharing the host network namespaces is disallowed. The field spec.hostNetwork
      must be unset or set to `false`.
