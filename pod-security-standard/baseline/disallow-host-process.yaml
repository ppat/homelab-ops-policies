---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check windowsHostProcess
#
# LAYER 1 PURE MIRROR. The conventions are stated once, in best-practices/restrict-node-port.yaml
# and ../restricted/restrict-volume-types.yaml; this file follows them.
#
# check_windowsHostProcess.go is a single versioned check (MinimumVersion 1.0), untouched since
# k8s 1.22. Its docstring lists only the pod-level and containers/initContainers fields, but the
# `visitContainers` helper it calls also walks ephemeralContainers -- which is why the expression
# below covers a level the upstream docstring does not name.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-process
  annotations:
    policies.kyverno.io/title: Disallow hostProcess
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Windows pods offer the ability to run HostProcess containers which enables privileged
      access to the Windows node. Privileged access to the host is disallowed in the baseline
      policy. HostProcess pods are an alpha feature as of Kubernetes v1.22. This policy ensures
      the `hostProcess` field, if present, is set to `false`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      !object.spec.?securityContext.?windowsOptions.?hostProcess.orValue(false) &&
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      !c.?securityContext.?windowsOptions.?hostProcess.orValue(false))
    message: >-
      HostProcess containers are disallowed. The fields
      spec.securityContext.windowsOptions.hostProcess,
      spec.containers[*].securityContext.windowsOptions.hostProcess,
      spec.initContainers[*].securityContext.windowsOptions.hostProcess,
      and spec.ephemeralContainers[*].securityContext.windowsOptions.hostProcess
      must either be undefined or set to `false`.
