---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check sysctls
#
# LAYER 1 PURE MIRROR (design doc phase2.0-policy-migration-design-v3.md §2.1). House style is
# set by best-practices/restrict-node-port.yaml and ../restricted/restrict-volume-types.yaml --
# read those headers first; this file follows their conventions without restating them.
#
# No estate exemptions exist for this policy (design §3.1) -- there is no
# exemptions/restrict-sysctls.yaml and no `patches:` entry for this file in kustomization.yaml.
# `matchConditions: []` is still declared, uniformly, per the PSS-mirror convention (see
# restrict-volume-types.yaml's header, point 1).
#
# check_sysctls.go: allow-list of sysctls considered kernel-namespaced/pod-isolated ("safe"),
# checked against `spec.securityContext.sysctls` only (the one place the API allows them -- no
# container-level equivalent exists). This is the MECHANICAL kind-migration commit -- the
# allow-list stays the five entries the legacy 1.22-era file carried. The 5 -> 12 expansion
# (design §5.3, verified against pss-research.md directly rather than the design doc's own
# summary of it) lands in a separate follow-up commit on this same file, so a revert of just that
# content refresh is possible without reverting the kind migration.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-sysctls
  annotations:
    policies.kyverno.io/title: Restrict sysctls
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Sysctls can disable security mechanisms or affect all containers on a
      host, and should be disallowed except for an allowed "safe" subset. A
      sysctl is considered safe if it is namespaced in the container or the
      Pod, and it is isolated from other Pods or processes on the same Node.
      This policy ensures that only those "safe" subsets can be specified in
      a Pod.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      object.spec.?securityContext.?sysctls.orValue([]).all(s, s.name in [
      'kernel.shm_rmid_forced', 'net.ipv4.ip_local_port_range',
      'net.ipv4.ip_unprivileged_port_start', 'net.ipv4.tcp_syncookies',
      'net.ipv4.ping_group_range'])
    message: >-
      Setting additional sysctls above the allowed type is disallowed.
      The field spec.securityContext.sysctls must be unset or not use any other names
      than kernel.shm_rmid_forced, net.ipv4.ip_local_port_range,
      net.ipv4.ip_unprivileged_port_start, net.ipv4.tcp_syncookies and
      net.ipv4.ping_group_range.
