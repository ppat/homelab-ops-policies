---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check seccompProfile_baseline
#
# LAYER 1 PURE MIRROR. The conventions are stated once, in best-practices/restrict-node-port.yaml
# and ../restricted/restrict-volume-types.yaml; this file follows them.
#
# THE BASELINE SECCOMP RULE, under which an unset profile is allowed. The restricted profile's
# counterpart -- where unset is itself a violation -- is a separate policy mirroring
# `seccompProfile_restricted`, ../restricted/restrict-seccomp-strict.yaml. The two read as
# near-duplicates and must not be collapsed into one.
#
# `.orValue('RuntimeDefault')` stands in for "field absent", it is NOT an API default; see
# disallow-selinux.yaml.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-seccomp
  annotations:
    policies.kyverno.io/title: Restrict Seccomp
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      The seccomp profile must not be explicitly set to Unconfined. This policy,
      requiring Kubernetes v1.19 or later, ensures that seccomp is unset or
      set to `RuntimeDefault` or `Localhost`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      object.spec.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in
      ['RuntimeDefault', 'Localhost'] &&
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in
      ['RuntimeDefault', 'Localhost'])
    message: >-
      Use of custom Seccomp profiles is disallowed. The fields
      spec.securityContext.seccompProfile.type,
      spec.containers[*].securityContext.seccompProfile.type,
      spec.initContainers[*].securityContext.seccompProfile.type, and
      spec.ephemeralContainers[*].securityContext.seccompProfile.type
      must be unset or set to `RuntimeDefault` or `Localhost`.
