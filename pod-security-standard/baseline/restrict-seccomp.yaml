---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check seccompProfile_baseline
#
# LAYER 1 PURE MIRROR (design doc phase2.0-policy-migration-design-v3.md §2.1). House style is
# set by best-practices/restrict-node-port.yaml and ../restricted/restrict-volume-types.yaml --
# read those headers first; this file follows their conventions without restating them.
#
# No estate exemptions exist for this policy (design §3.1) -- there is no
# exemptions/restrict-seccomp.yaml and no `patches:` entry for this file in kustomization.yaml.
# `matchConditions: []` is still declared, uniformly, per the PSS-mirror convention (see
# restrict-volume-types.yaml's header, point 1).
#
# `seccompProfile_baseline` (pss-research.md, MinimumVersion 1.0 / 1.19): unchanged since k8s
# 1.22 -- seccomp must be unset or `RuntimeDefault`/`Localhost`, at pod and
# container/initContainer/ephemeralContainer level. The `restricted` profile's own seccomp check
# (`seccompProfile_restricted`, E5/E5's `restrict-seccomp-strict`) is a separate, stricter policy
# in ../restricted/ -- see design §3.2 -- not touched by this unit.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-seccomp
  annotations:
    policies.kyverno.io/title: Restrict Seccomp
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      The seccomp profile must not be explicitly set to Unconfined. This policy,
      requiring Kubernetes v1.19 or later, ensures that seccomp is unset or
      set to `RuntimeDefault` or `Localhost`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      object.spec.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in
      ['RuntimeDefault', 'Localhost'] &&
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?seccompProfile.?type.orValue('RuntimeDefault') in
      ['RuntimeDefault', 'Localhost'])
    message: >-
      Use of custom Seccomp profiles is disallowed. The fields
      spec.securityContext.seccompProfile.type,
      spec.containers[*].securityContext.seccompProfile.type,
      spec.initContainers[*].securityContext.seccompProfile.type, and
      spec.ephemeralContainers[*].securityContext.seccompProfile.type
      must be unset or set to `RuntimeDefault` or `Localhost`.
