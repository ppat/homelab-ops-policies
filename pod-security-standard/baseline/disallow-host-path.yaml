---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check hostPathVolumes
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape, CEL
# conventions) and ../restricted/restrict-volume-types.yaml (the PSS-mirror family conventions).
#
# THE MOST EXEMPTION-DENSE POLICY IN THIS PROFILE, and none of those exemptions is visible in
# this file: they live in exemptions/disallow-host-path.yaml and are applied as a kustomize
# JSON6902 patch. Read the two together before concluding anything about what this policy does in
# production.
#
# RELATIONSHIP TO ../restricted/restrict-volume-types.yaml, which a reader will meet next.
# Restricted's `restrictedVolumes` check OVERRIDES this one (pod-security-admission resolves the
# pair through `OverrideCheckIDs`) and its allow-list has no `hostPath` entry, so under
# `restricted` hostPath is refused by that policy instead. Both ship, and `restricted`'s
# kustomization.yaml includes ../baseline, so both are in that profile's built stream. Their
# exemption sets are deliberately NOT the same and must not be "aligned": a consumer applying
# `baseline` on its own gets only this file's set, so for that consumer this policy is the whole
# of the hostPath decision.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-path
  annotations:
    policies.kyverno.io/title: Disallow hostPath
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      HostPath volumes let Pods use host directories and volumes in containers.
      Using host resources can be used to access shared data or escalate privileges
      and should not be allowed. This policy ensures no hostPath volumes are in use.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # Deliberately per-volume, and a single-source DENY where ../restricted/restrict-volume-types.
  # yaml is an ALLOW-list over the same field. Neither is written over a flattened list of every
  # volume's keys, which is the form that sits one edit away from reading "if ANY key is allowed,
  # pass".
  - expression: >-
      object.spec.?volumes.orValue([]).all(volume, !has(volume.hostPath))
    message: >-
      HostPath volumes are forbidden. The field spec.volumes[*].hostPath must be unset.
