---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check capabilities_baseline
#
# LAYER 1 PURE MIRROR. The conventions are stated once, in best-practices/restrict-node-port.yaml
# and ../restricted/restrict-volume-types.yaml; this file follows them.
#
# Estate exemptions live in exemptions/disallow-capabilities.yaml, appended to
# `spec.matchConditions` by kustomization.yaml. Read the two together.
#
# check_capabilities_baseline.go holds a single versioned allow-list, `capabilities_allowed_1_0`,
# untouched since k8s 1.22, and no `hostUsers` relaxation -- so unlike the runAsNonRoot and
# runAsUser checks there is no user-namespace branch here for a resync to pick up.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities
  annotations:
    policies.kyverno.io/title: Disallow Capabilities
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Adding capabilities beyond those listed in the policy must be disallowed.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?capabilities.?add.orValue([]).all(cap, cap in [
      'AUDIT_WRITE', 'CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'FSETID', 'KILL', 'MKNOD',
      'NET_BIND_SERVICE', 'SETFCAP', 'SETGID', 'SETPCAP', 'SETUID', 'SYS_CHROOT']))
    message: >-
      Any capabilities added beyond the allowed list (AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER,
      FSETID, KILL, MKNOD, NET_BIND_SERVICE, SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT)
      are disallowed.
