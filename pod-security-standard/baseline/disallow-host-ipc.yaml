---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check hostNamespaces
#
# House style: ../../best-practices/restrict-node-port.yaml and
# ../restricted/restrict-volume-types.yaml. Why PSS's single `hostNamespaces` check is three
# policies here: see disallow-host-network.yaml's header.
#
# Of the three this is the one with NO exemptions: no exemptions/disallow-host-ipc.yaml, no
# `patches:` entry in ./kustomization.yaml. Its two siblings each carry a different set, and that
# is what the separate files buy -- a joined policy would grant this field both of theirs.
# `matchConditions: []` is declared anyway: it is the seam an exemption would append to, and a
# JSON6902 append to an absent parent fails the kustomize build.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-ipc
  annotations:
    policies.kyverno.io/title: Disallow Host IPC Namespace
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      The host inter-process communication namespace allows access to shared information and
      can be used to elevate privileges. Pods should not be allowed access to it. This policy
      ensures the field which makes use of the host IPC namespace is unset or set to `false`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  - expression: >-
      !object.spec.?hostIPC.orValue(false)
    message: >-
      Sharing the host ipc namespaces is disallowed. The field spec.hostIPC must be
      unset or set to `false`.
