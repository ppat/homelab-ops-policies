---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check hostNamespaces
#
# House style: ../../best-practices/restrict-node-port.yaml and
# ../restricted/restrict-volume-types.yaml. The three-way split of the legacy
# `disallow-host-namespaces` ClusterPolicy is explained in full in the header of its sibling
# disallow-host-network.yaml.
#
# THIS FILE'S HALF OF THE SPLIT carries the legacy `host-ipc-namespaces` rule, which had NO
# `exclude:` block at all -- so there is no exemptions/disallow-host-ipc.yaml and no `patches:`
# entry for it in ../kustomization.yaml. `matchConditions: []` is still present and still empty:
# it is the seam an exemption would append to, and a JSON6902 append to an absent parent fails
# the kustomize build. Uniform presence is what makes adding the first exemption a one-file
# change (design doc phase2.0-policy-migration-design-v3.md §2.2).
#
# That this policy is the only one of the three with no exemptions is precisely why the split
# exists: joined, it would have inherited the other two rules' five exclusions.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-ipc
  annotations:
    policies.kyverno.io/title: Disallow Host IPC Namespace
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      The host inter-process communication namespace allows access to shared information and
      can be used to elevate privileges. Pods should not be allowed access to it. This policy
      ensures the field which makes use of the host IPC namespace is unset or set to `false`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # Translated from the legacy conditional anchor `=(hostIPC): "false"`. See
  # disallow-host-network.yaml's validation comment -- same shape, same reasoning.
  - expression: >-
      !object.spec.?hostIPC.orValue(false)
    message: >-
      Sharing the host ipc namespaces is disallowed. The field spec.hostIPC must be
      unset or set to `false`.
