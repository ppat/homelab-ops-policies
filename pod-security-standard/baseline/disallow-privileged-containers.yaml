---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check privileged
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape, CEL
# conventions) and ../restricted/restrict-volume-types.yaml (the PSS-mirror family conventions).
#
# This policy's exemptions -- and the repo's anchor rationale for every virt-handler exemption,
# which other files cite rather than restate -- live in
# exemptions/disallow-privileged-containers.yaml. Read the two together.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Privileged mode disables most security mechanisms and must not be allowed. This policy
      ensures Pods do not call for privileged mode.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # ALL THREE CONTAINER LISTS, concatenated, mirroring pod-security-admission's own
  # `visitContainers()`. That includes NATIVE SIDECARS, which PSA does not special-case -- there
  # are zero `RestartPolicy` references in its policy directory -- so a sidecar must carry a
  # compliant securityContext itself, and this expression sees it because a sidecar is an
  # initContainer. Every PSS mirror over containers in this repo uses the same concatenation.
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      !c.?securityContext.?privileged.orValue(false))
    message: >-
      Privileged mode is disallowed. The fields
      spec.containers[*].securityContext.privileged,
      spec.initContainers[*].securityContext.privileged, and
      spec.ephemeralContainers[*].securityContext.privileged must be unset or
      set to `false`.
