---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check privileged
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape, CEL
# conventions) and ../restricted/restrict-volume-types.yaml (the PSS-mirror family conventions:
# snapshot marker, empty `matchConditions` seam, autogen off, dropped `preconditions`).
#
# THE REPO'S ANCHOR RATIONALE FOR EVERY virt-handler EXEMPTION USED TO LIVE IN THIS FILE and no
# longer does. It moved, unchanged, to exemptions/disallow-privileged-containers.yaml, because a
# Layer-1 pure mirror carries the PSS rule and nothing about this estate (design doc
# phase2.0-policy-migration-design-v3.md §2.1). Other files across this repo say "see
# disallow-privileged-containers.yaml"; that pointer now resolves to the patch file next door,
# and this note exists so the pointer does not dead-end here. Read the two files together.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # Bumped from the legacy `kyverno.io/kyverno-version: 1.6.0`, which is dropped as redundant.
    policies.kyverno.io/minversion: 1.17.0
    # Was "1.22-1.23" on the legacy ClusterPolicy; this file is a fresh mirror at the snapshot
    # named at the top.
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Privileged mode disables most security mechanisms and must not be allowed. This policy
      ensures Pods do not call for privileged mode.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # ALL THREE CONTAINER LISTS, concatenated and checked with one `.all()`. This mirrors
  # pod-security-admission's own `visitContainers()`, which iterates `containers`,
  # `initContainers` and `ephemeralContainers` identically -- including native sidecars, which
  # PSA does not special-case (there are zero `RestartPolicy` references in its policy directory).
  # A sidecar must therefore carry a compliant securityContext itself, and this expression sees
  # it because a sidecar IS an initContainer.
  #
  # `.orValue([])` on the two optional lists and `.orValue(false)` on the optional field are the
  # null-safe forms; `.all()` makes the whole expression statically bool. Translated from the
  # legacy conditional-anchor pattern `=(privileged): "false"` on each of the three lists, which
  # had identical semantics: absent passes, false passes, true fails.
  #
  # `spec.containers` is NOT written `.?containers.orValue([])`: the API requires at least one
  # container, so unlike the other two lists it is never absent.
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      !c.?securityContext.?privileged.orValue(false))
    message: >-
      Privileged mode is disallowed. The fields
      spec.containers[*].securityContext.privileged,
      spec.initContainers[*].securityContext.privileged, and
      spec.ephemeralContainers[*].securityContext.privileged must be unset or
      set to `false`.
