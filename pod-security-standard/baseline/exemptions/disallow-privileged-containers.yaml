---
# LAYER 2 -- ESTATE EXEMPTIONS for ../disallow-privileged-containers.yaml, applied by the
# `patches:` entry in ../kustomization.yaml. House-style reference for this file shape:
# ../../restricted/exemptions/restrict-volume-types.yaml, whose numbered conventions apply here
# unchanged.
#
# THIS FILE HOLDS THE REPO'S ANCHOR RATIONALE FOR virt-handler. Other exemption files cite it
# rather than restating the argument. Anything that would change the argument -- KubeVirt's node
# placement, the virt-handler/virt-launcher boundary, the CVE lineage -- is a change to make
# HERE, once, and to cite from elsewhere rather than copy in an edited form.

# `csi-driver-nfs`, `kube-system`, `longhorn-system` and `system-upgrade` are the same node-level
# namespaces ./disallow-host-path.yaml excuses, for the same reason -- each is a dedicated
# single-purpose namespace whose contents legitimately act on the node. `tailscale` appears here
# but NOT there: the Tailscale operator's subnet-router and exit-node pods need privileged mode
# for /dev/net/tun and kernel routing, without needing a host path mount. The two lists are
# deliberately different; do not "align" them.
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-node-level-namespaces
    expression: >-
      !(object.metadata.?namespace.orValue('') in
      ['csi-driver-nfs', 'kube-system', 'longhorn-system', 'system-upgrade', 'tailscale'])

# node-problem-detector runs privileged to read the node's kernel ring buffer and journal.
# Name- AND namespace-scoped: `monitoring` holds many workloads with no such need. The
# node-exporter glob that accompanies this one in ./disallow-host-path.yaml is deliberately
# absent here -- node-exporter mounts host paths but does not run privileged.
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-node-problem-detector
    expression: >-
      !(object.metadata.?namespace.orValue('') == 'monitoring' &&
      (object.metadata.?name.orValue('') + object.metadata.?generateName.orValue(''))
      .startsWith('node-problem-detector'))

# Grants virt-handler root plus every Linux capability on whichever node it lands on -- it is the
# node agent that opens /dev/kvm and other host devices, drives libvirt/qemu process lifecycle,
# and edits cgroups directly, none of which an unprivileged container can do. Bounded by:
# KubeVirt's CR `spec.workloads.nodePlacement.nodeSelector`, which restricts virt-handler to the
# nodes an operator prepares for it rather than the whole cluster; and by virt-launcher, where a
# VM's guest actually runs, being deliberately NOT privileged (its one, much narrower, exemption
# is the inline `exclude:` in ../../restricted/restrict-seccomp-strict.yaml). NOT bounded here:
# a QEMU/KVM guest escape into virt-launcher is one more bug away from the host, at exactly the
# virt-handler<->virt-launcher boundary -- a boundary with a live CVE lineage (CVE-2025-64437,
# CVE-2025-64433). Keep KubeVirt patched; this exemption doesn't defend against that class of
# bug, only the DaemonSet's own shape. `virt-operator`/`virt-api`/`virt-controller` aren't
# exempted anywhere in this repo: verified against upstream KubeVirt's generated manifests, none
# of them runs privileged. See ./disallow-host-path.yaml for why every virt-handler exemption
# here is name-scoped, not namespace-scoped, and why only the `kubevirt` namespace is listed.
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-virt-handler
    expression: >-
      !(object.metadata.?namespace.orValue('') == 'kubevirt' &&
      (object.metadata.?name.orValue('') + object.metadata.?generateName.orValue(''))
      .startsWith('virt-handler'))
