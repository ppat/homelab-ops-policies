---
# LAYER 2 -- ESTATE EXEMPTIONS for ../disallow-capabilities.yaml, applied by the `patches:` entry
# in ../kustomization.yaml. A JSON6902 patch document, NOT a manifest. The conventions every
# exemption file here follows are stated in
# ../../restricted/exemptions/restrict-volume-types.yaml.

# THE ONLY WHOLE-NAMESPACE EXEMPTION IN THIS REPO. Everything created in these five namespaces
# goes unevaluated, not merely the node-level components that need capabilities beyond the
# baseline set, and that breadth is the cost. It holds only while each namespace stays occupied
# by the single operator that owns it; the day arbitrary workloads can land in one, this has to
# become per-workload predicates, paying the usual price of name prefixes that chart upgrades
# move.
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-namespaces
    expression: >-
      !(object.metadata.?namespace.orValue('') in
      ['csi-driver-nfs', 'longhorn-system', 'metallb-system', 'system-upgrade', 'tailscale'])

# INERT AGAINST TODAY'S WORKLOAD AND KEPT DELIBERATELY: virt-handler declares no
# `capabilities.add` at all, taking what it needs from `privileged: true` instead (see
# ../disallow-privileged-containers.yaml), so this decides nothing right now. It stays because
# what a privileged upstream DaemonSet declares is KubeVirt's to change, not this repo's, and the
# cost of carrying it is confined to the one component here that already runs privileged.
# virt-launcher is NOT exempted, here or anywhere in this file: its default capability set is
# NET_BIND_SERVICE alone, already inside the mirror's allow-list.
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-virt-handler
    expression: >-
      !(object.metadata.?namespace.orValue('') == 'kubevirt' &&
      (object.metadata.?name.orValue('') + object.metadata.?generateName.orValue('')).startsWith('virt-handler'))
