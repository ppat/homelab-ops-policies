---
# LAYER 2 -- ESTATE EXEMPTIONS for ../disallow-host-pid.yaml (design doc
# phase2.0-policy-migration-design-v3.md §2.2). Applied by the `patches:` entry in
# ../kustomization.yaml. House-style reference for this file shape:
# ../../restricted/exemptions/restrict-volume-types.yaml.
#
# THESE TWO ENTRIES ARE THE `host-pid-namespaces` RULE'S EXCLUSIONS AND ONLY THOSE. The
# `csi-driver-nfs` and `metallb-system` namespace exclusions in ./disallow-host-network.yaml
# belong to the hostNetwork rule; they are not repeated here and must not be.

# kube-prometheus-stack's node-exporter DaemonSet reads per-node process and kernel state, which
# requires seeing the host's PID namespace. Name- AND namespace-scoped together; see the
# corresponding entry in ./disallow-host-network.yaml for why `monitoring` is not exempted
# wholesale.
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-node-exporter
    expression: >-
      !(object.metadata.?namespace.orValue('') == 'monitoring' &&
      (object.metadata.?name.orValue('') + object.metadata.?generateName.orValue(''))
      .startsWith('kube-prometheus-stack-prometheus-node-exporter'))

# virt-handler sets hostPID: true to see and supervise the qemu process libvirt starts
# on the node -- it has no other way to monitor a process that isn't a child of its own
# container. See disallow-privileged-containers.yaml for what bounds virt-handler's
# access generally. Verified against upstream KubeVirt's generated manifests: virt-handler
# doesn't set hostNetwork or hostIPC, so neither the rule above nor the one below carries
# a KubeVirt exclusion, and virt-operator/virt-api/virt-controller/virt-launcher don't
# need this rule's exclusion either.
#
# MIGRATION NOTE (Phase 2 kind migration), read with the block above, which is ported VERBATIM
# from the legacy `disallow-host-namespaces` ClusterPolicy's `host-pid-namespaces` rule. Two of
# its references moved and neither claim changed:
#   * "neither the rule above nor the one below" meant the hostNetwork and hostIPC rules of that
#     same three-rule policy. Those rules are now ../disallow-host-network.yaml and
#     ../disallow-host-ipc.yaml, and the statement still holds exactly: neither carries a
#     KubeVirt exclusion (check ./disallow-host-network.yaml -- there is no
#     ./disallow-host-ipc.yaml at all, because that policy has no exemptions).
#   * "See disallow-privileged-containers.yaml" now means
#     ./disallow-privileged-containers.yaml -- the anchor rationale for every virt-handler
#     exemption in this repo lives in that PATCH file, not in the pure mirror beside it, because
#     the pure mirrors carry no estate content at all (§2.1).
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-virt-handler
    expression: >-
      !(object.metadata.?namespace.orValue('') == 'kubevirt' &&
      (object.metadata.?name.orValue('') + object.metadata.?generateName.orValue(''))
      .startsWith('virt-handler'))
