---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check hostNamespaces
#
# House style: ../../best-practices/restrict-node-port.yaml and
# ../restricted/restrict-volume-types.yaml. The three-way split of the legacy
# `disallow-host-namespaces` ClusterPolicy is explained in full in the header of its sibling
# disallow-host-network.yaml -- read that one for the rationale; it is not repeated here.
#
# THIS FILE'S HALF OF THE SPLIT carries the legacy `host-pid-namespaces` rule and ONLY that
# rule's exclusions: the node-exporter glob in `monitoring`, and `virt-handler*` in `kubevirt`.
# The `csi-driver-nfs` / `metallb-system` namespace exclusions belong to the hostNetwork rule and
# are deliberately NOT here; `disallow-host-ipc` has no exclusions at all.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-pid
  annotations:
    policies.kyverno.io/title: Disallow Host PID Namespace
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.17.0
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      The host process ID namespace allows access to shared information and can be used to
      elevate privileges. Pods should not be allowed access to it. This policy ensures the
      field which makes use of the host PID namespace is unset or set to `false`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # Translated from the legacy conditional anchor `=(hostPID): "false"`. See
  # disallow-host-network.yaml's validation comment -- same shape, same reasoning.
  - expression: >-
      !object.spec.?hostPID.orValue(false)
    message: >-
      Sharing the host pid namespaces is disallowed. The field spec.hostPID must be
      unset or set to `false`.
