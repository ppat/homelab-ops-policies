---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../baseline
# disallow-capabilities-strict.yaml is now the ADD-CHECK ONLY: it was one ClusterPolicy with two
# rules whose `exclude:` blocks differed (`require-drop-all` excluded virt-handler, the add-check
# excluded nothing), and `spec.matchConditions` is policy-wide. require-drop-all.yaml below is the
# other half (design doc phase2.0-policy-migration-design-v3.md §2.3; full rationale in
# require-drop-all.yaml's header). Keeping them joined would have widened the virt-handler
# exemption to the add-check.
- disallow-capabilities-strict.yaml
- disallow-privilege-escalation.yaml
- require-drop-all.yaml
- require-run-as-non-root-user.yaml
- require-run-as-nonroot.yaml
- restrict-seccomp-strict.yaml
- restrict-volume-types.yaml

# LAYER 2 -- estate exemptions (design doc phase2.0-policy-migration-design-v3.md §2.2). Each
# entry attaches one file from exemptions/ to the policy of the same basename. The files under
# exemptions/ are JSON6902 patch documents, NOT manifests, so they must never appear in
# `resources:` above.
#
# The `target:` block is matched by group+version+kind+name; `version: v1` here must track the
# apiVersion the policy file itself declares (`policies.kyverno.io/v1`). Note that v1 is a SERVED
# but non-storage version at Kyverno 1.18.2 (storage is v1beta1) -- that affects what you read
# back off a live cluster, not what kustomize matches here, which is purely textual.
#
# A patch whose target matches nothing is a SILENT NO-OP in kustomize: it does not fail the
# build. The thing that actually catches a mistyped target is the CLI-tier test asserting `skip`
# on each exemption's firing fixture (ci/policy-tests/kyverno/restricted/restrict-volume-types/)
# -- without the exemption those fixtures report `fail`. Do not add an entry here without one.
#
# ONE POLICY IN THIS PROFILE DELIBERATELY HAS NO ENTRY: disallow-capabilities-strict, the
# add-check half of the §2.3 split -- attaching require-drop-all's virt-handler exemption to it is
# the specific mistake the split exists to prevent. It still declares `matchConditions: []` in its
# own file, which is the seam a future exemption appends to.
patches:
- path: exemptions/disallow-privilege-escalation.yaml
  target:
    group: policies.kyverno.io
    version: v1
    kind: ValidatingPolicy
    name: disallow-privilege-escalation
- path: exemptions/require-drop-all.yaml
  target:
    group: policies.kyverno.io
    version: v1
    kind: ValidatingPolicy
    name: require-drop-all
- path: exemptions/require-run-as-non-root-user.yaml
  target:
    group: policies.kyverno.io
    version: v1
    kind: ValidatingPolicy
    name: require-run-as-non-root-user
- path: exemptions/restrict-volume-types.yaml
  target:
    group: policies.kyverno.io
    version: v1
    kind: ValidatingPolicy
    name: restrict-volume-types
