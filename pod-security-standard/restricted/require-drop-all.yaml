---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check
# capabilities_restricted
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape, CEL
# conventions) and ./restrict-volume-types.yaml (the PSS-mirror family conventions: snapshot
# marker, empty `matchConditions` seam, autogen off, dropped `preconditions`). Read those two
# headers first; nothing they say is restated here.
#
# ONE OF TWO FILES REPLACING THE LEGACY `disallow-capabilities-strict` ClusterPolicy, which
# carried two rules (`require-drop-all`, `adding-capabilities-strict`) with DIFFERENT `exclude:`
# blocks: `require-drop-all` excluded `virt-handler*` in `kubevirt`, `adding-capabilities-strict`
# excluded nothing. The split into this file and ./disallow-capabilities-strict.yaml is design doc
# phase2.0-policy-migration-design-v3.md §2.3, and it is not cosmetic: `spec.matchConditions` is
# POLICY-WIDE on a `ValidatingPolicy`, so keeping the two rules joined would apply the
# virt-handler exemption to BOTH checks and silently widen it to the add-check -- a real
# weakening. The legacy file's own comment says as much ("The sibling rule below
# (adding-capabilities-strict) isn't excluded"), and that sentence is what the split preserves.
#
# What the split costs, recorded once here: two PolicyReport policy names replace one. Nothing
# consumes those names programmatically, this repo is Audit-mode, and a kind migration is the only
# cheap moment to rename a report key -- see ../baseline/disallow-host-network.yaml's header for
# the same trade taken three ways.
#
# ONE KNOWN FIDELITY DELTA, STATED HERE SO IT IS NOT REDISCOVERED AS A SURPRISE. PSS at policy
# version v1.25 exempts `spec.os.name == "windows"` pods from the WHOLE `capabilities_restricted`
# check -- `capabilitiesRestricted_1_25()` returns early before either the add-list or the
# drop-ALL half runs. This file deliberately does NOT carry that disjunct: design §5.8 names three
# pure files for the Windows exemptions (`disallow-privilege-escalation`, `restrict-seccomp-strict`,
# `disallow-capabilities-strict`) and, post-§2.3-split, `disallow-capabilities-strict` is the
# add-check half only -- so the disjunct lands there and not here. The delta is inert on this
# estate (no Windows nodes, no `spec.os.name: windows` pod anywhere) and costs at most one Audit
# row on a hypothetical Windows pod that omits `drop: [ALL]`. If a Windows workload ever lands,
# add the same leading disjunct ./disallow-capabilities-strict.yaml carries; do not instead delete
# it from there.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-drop-all
  annotations:
    policies.kyverno.io/title: Require Drop ALL Capabilities
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # Bumped from the legacy `kyverno.io/kyverno-version: 1.6.0`, which is dropped as redundant:
    # `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Was "1.22-1.23" on the legacy ClusterPolicy; this file is a fresh mirror at the snapshot
    # named at the top.
    kyverno.io/kubernetes-version: "1.36"
    # The legacy description covered both halves of the policy in one sentence pair ("Adding
    # capabilities other than `NET_BIND_SERVICE` is disallowed. In addition, all containers must
    # explicitly drop `ALL` capabilities."). Each half keeps the sentence that describes it; the
    # other sentence lives on ./disallow-capabilities-strict.yaml.
    policies.kyverno.io/description: >-
      All containers must explicitly drop `ALL` capabilities. Dropping `ALL` and then re-adding
      only what is needed is what makes the container's capability set auditable from its
      manifest rather than inherited from the runtime's default set.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # All three container lists concatenated, mirroring pod-security-admission's own
  # `visitContainers()`. `spec.containers` needs no `.?`/`.orValue([])` because the API requires at
  # least one container.
  #
  # Translated from the legacy `foreach` + `deny.conditions` pair
  # `key: ALL, operator: AnyNotIn, value: "{{ element.securityContext.capabilities.drop[] || `[]` }}"`
  # -- which reads "deny when ALL is not among the dropped capabilities". `'ALL' in <list>` is the
  # direct CEL spelling of that, and `.orValue([])` reproduces the JMESPath `|| []` fallback for a
  # container with no `securityContext`, no `capabilities`, or no `drop`. `in` and `.all()` are
  # both bool-returning, so the expression is statically bool (see restrict-node-port.yaml's
  # convention 3).
  #
  # NOTE THE CASE SENSITIVITY, which the legacy form had too: PSS compares against the literal
  # string "ALL" (`capabilityAll = "ALL"` in check_capabilities_restricted.go), so `drop: [all]`
  # does not satisfy this and should not -- the Kubernetes API does not canonicalise the value.
  #
  # The legacy `preconditions` block asserting `request.operation != DELETE` is DROPPED, not
  # translated: `matchConstraints.resourceRules[].operations: [CREATE, UPDATE]` already excludes
  # DELETE (design §1.2).
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      'ALL' in c.?securityContext.?capabilities.?drop.orValue([]))
    # LEGACY WORDING, kept verbatim per the house rule
    # ../../best-practices/restrict-node-port.yaml states as its DEVIATION 2: the message is what
    # already appears in this estate's PolicyReports, and a mechanical kind migration is not the
    # moment to churn a human-facing string.
    message: >-
      Containers must drop `ALL` capabilities.
