---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check
# capabilities_restricted
#
# House style: ../../best-practices/restrict-node-port.yaml and ./restrict-volume-types.yaml.
#
# THE ADD-CHECK HALF of PSS's `capabilities_restricted`. ./require-drop-all.yaml is the other
# half and its header carries the reasoning for the two being separate policies; it is not
# repeated here.
#
# THIS HALF HAS NO ESTATE EXEMPTION AND MUST NOT ACQUIRE ONE BY ACCIDENT. There is no
# exemptions/disallow-capabilities-strict.yaml and no `patches:` entry for it in
# ./kustomization.yaml, and that is the whole point of the separation: virt-handler's manifest
# never adds a named capability, so it passes this check on its own merits. Copying
# ./exemptions/require-drop-all.yaml onto this policy would excuse a check virt-handler already
# satisfies, and would excuse it for every future virt-handler container change too.
# ci/policy-tests/kyverno/restricted/disallow-capabilities-strict/pod-virt-handler-add-sys-admin-fail.yaml
# is the alarm: it goes red if that ever happens.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-capabilities-strict
  annotations:
    policies.kyverno.io/title: Disallow Capabilities (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Tracks the Kubernetes minor in the PSS-SNAPSHOT line at the top of this file.
    kyverno.io/kubernetes-version: "1.36"
    # Describes this half only; the drop-ALL sentence lives on ./require-drop-all.yaml.
    policies.kyverno.io/description: >-
      Adding capabilities other than `NET_BIND_SERVICE` is disallowed.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # THE LEADING WINDOWS DISJUNCT, THE REFERENCE INSTANCE OF FOUR IN THIS REPO -- the others are
  # on ./require-drop-all.yaml, ./disallow-privilege-escalation.yaml and
  # ./restrict-seccomp-strict.yaml, and they cite this comment rather than restating it. PSS at
  # policy version v1.25 exempts `spec.os.name == "windows"` pods from the Restricted
  # capabilities, allowPrivilegeEscalation and seccomp checks:
  # all three constrain Linux kernel primitives that do not exist on a Windows node, so enforcing
  # them there would flag a pod for not setting a field that has no meaning. PSS implements each
  # as an early `return CheckResult{Allowed: true}` -- an ALLOW, not a decision to skip the check,
  # which is why this is a validation disjunct and not a `matchCondition`. The two report
  # differently (`pass` versus `skip`) and are not interchangeable.
  #
  # INERT ON THIS ESTATE -- no Windows node, and nothing sets `spec.os.name`. Carried for fidelity
  # rather than for a workload: mirroring a standard selectively is how a mirror stops being one.
  # Expressed against pod-spec shape rather than node-OS facts, which is what keeps it correct if
  # the estate ever changes.
  #
  # `.orValue('')` rather than a `has()` guard: `spec.os` is optional and `spec.os.name` is
  # required within it, so the empty string is unreachable as a real value and reads as "no os
  # block was set".
  #
  # All three container lists concatenated, mirroring `visitContainers()`.
  - expression: >-
      object.spec.?os.?name.orValue('') == 'windows' ||
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?capabilities.?add.orValue([]).all(a, a == 'NET_BIND_SERVICE'))
    # Held stable per ../../best-practices/restrict-node-port.yaml's DEVIATION 2.
    message: >-
      Any capabilities added other than NET_BIND_SERVICE are disallowed.
