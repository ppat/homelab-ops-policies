---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check runAsNonRoot
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape and CEL
# conventions) and ./restrict-volume-types.yaml (the PSS-mirror family: the `PSS-SNAPSHOT:`
# marker, the empty `matchConditions` seam, `autogen.podControllers.controllers: []`).
#
# This is a LAYER 1 PURE MIRROR: the estate exemption this policy has in production lives in
# ./exemptions/require-run-as-nonroot.yaml. Read the two together.
#
# THE `matchConditions` LIST HERE IS NOT EMPTY -- same PSS userns relaxation as
# ./require-run-as-non-root-user.yaml and ../baseline/disallow-proc-mount.yaml. The latter is the
# reference instance and carries the full reasoning; it is not repeated in this file.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-nonroot
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Tracks the Kubernetes minor in the PSS-SNAPSHOT line at the top of this file.
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      `runAsNonRoot` is set to `true`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  # THE hostUsers SKIP PATTERN. Reference instance and full reasoning:
  # ../baseline/disallow-proc-mount.yaml. Keep the spelling identical so the set stays greppable.
  matchConditions:
  - name: skip-user-namespaced-pods
    # runAsNonRoot/runAsUser are skipped for pods in a user namespace -- root inside the
    # userns is unprivileged on the host, which is the property these checks exist to
    # guarantee.
    expression: "object.spec.?hostUsers.orValue(true) == true"
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # MIRRORS PSA, NOT THE UPSTREAM KYVERNO POLICY-LIBRARY RULE OF THE SAME NAME, and the two
  # disagree on one pod shape. This note is the argument; read it before changing either conjunct.
  #
  # WHAT PSS DOES (`check_runAsNonRoot.go`). It computes, per container, an EFFECTIVE value: the
  # container's own `runAsNonRoot` if set, otherwise the pod-level one, otherwise unset. It then
  # forbids three things:
  #   (a) pod-level `runAsNonRoot: false` -- an explicit opt-out, forbidden on its own, whatever
  #       the containers say;
  #   (b) any container with an explicit `runAsNonRoot: false`;
  #   (c) any container that sets nothing and is not covered by a pod-level `true`.
  # The two conjuncts below are (a) and then (b)+(c) together, in that order. The inner
  # `.orValue(<the pod-level value>)` IS the inheritance step, and the outer `.orValue(false)` on
  # the pod-level lookup is what makes "nobody said anything" a violation rather than a pass.
  #
  # THE DISAGREEMENT IS CASE (a). The library rule tests the container level only, so a pod
  # declaring `spec.securityContext.runAsNonRoot: false` whose containers all override it to true
  # passes there. PSA forbids that pod outright -- the pod-level value goes into `badSetters`
  # before the containers are consulted. This file follows PSA: a pure mirror's delta against its
  # `check_*.go` is supposed to be zero, and a mirror that silently disagrees with the standard it
  # claims to mirror is what the `PSS-SNAPSHOT:` marker and the pure/exemption split exist to
  # prevent.
  # ci/policy-tests/kyverno/restricted/require-run-as-nonroot/pod-podlevel-false-containers-true-fail.yaml
  # asserts that case, making the delta executable rather than a claim in a comment. Nothing on
  # this estate is shaped that way and the policy is Audit-mode, so the cost is at most one report
  # row.
  #
  # `== true` on both conjuncts is the static-bool requirement, same as the matchCondition above.
  - expression: >-
      object.spec.?securityContext.?runAsNonRoot.orValue(true) == true &&
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?runAsNonRoot.orValue(
      object.spec.?securityContext.?runAsNonRoot.orValue(false)) == true)
    # Held stable per ../../best-practices/restrict-node-port.yaml's DEVIATION 2. Its
    # "Either ... or ..." shape still describes the rule correctly: the pod-level field covers
    # every container that does not override it.
    message: >-
      Running as root is not allowed. Either the field
      spec.securityContext.runAsNonRoot must be set to `true`, or the fields
      spec.containers[*].securityContext.runAsNonRoot,
      spec.initContainers[*].securityContext.runAsNonRoot, and
      spec.ephemeralContainers[*].securityContext.runAsNonRoot must be set to `true`.
