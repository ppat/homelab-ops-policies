---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check runAsUser
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape and CEL
# conventions) and ./restrict-volume-types.yaml (the PSS-mirror family: the `PSS-SNAPSHOT:`
# marker, the empty `matchConditions` seam, `autogen.podControllers.controllers: []`).
#
# This is a LAYER 1 PURE MIRROR: the estate exemption this policy has in production lives in
# ./exemptions/require-run-as-non-root-user.yaml. Read the two together.
#
# THE `matchConditions` LIST HERE IS NOT EMPTY, and its entry is NOT an estate exemption -- it is
# the PSS userns relaxation, which is rule semantics and therefore belongs in the mirror. The
# pattern's reference instance, with the full reasoning, is ../baseline/disallow-proc-mount.yaml;
# this file carries its block verbatim rather than re-deriving it. The append seam is unaffected
# by the list being non-empty: `op: add` onto `/spec/matchConditions/-` appends to a populated
# list exactly as to an empty one, and every entry is ANDed either way -- which is what lets the
# estate exemption coexist with the standard's own condition without either being able to widen
# the other.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-run-as-non-root-user
  annotations:
    policies.kyverno.io/title: Require Run As Non-Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Tracks the Kubernetes minor in the PSS-SNAPSHOT line at the top of this file.
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Containers must be required to run as non-root users. This policy ensures
      `runAsUser` is either unset or set to a number greater than zero.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  # THE hostUsers SKIP PATTERN. Reference instance and full reasoning:
  # ../baseline/disallow-proc-mount.yaml. The spelling is identical everywhere it appears --
  # here, ./require-run-as-nonroot.yaml and that file -- so `grep -rn skip-user-namespaced-pods`
  # finds the whole set; keep it that way. Two points from the reference are worth repeating
  # because they are the ones a reader of THIS policy is most likely to get wrong:
  #
  #   * `== true` IS NOT REDUNDANT. `object.spec` is unstructured, so `object.spec.?hostUsers`
  #     types as `optional(dyn)` and `.orValue(true)` yields `dyn`, while Kyverno's compiler
  #     requires the expression's STATIC type to be bool. Without the comparison this does not
  #     compile.
  #   * A `matchCondition`, NOT A DISJUNCT IN THE VALIDATION, because PSS's semantics is that the
  #     check does not run: the resource reports `skip`, not `pass`, and the CLI tier can tell
  #     those apart. Whether a live PolicyReport writes a `skip` ROW for a filtered resource is
  #     not established, so say "the check is skipped", not "you will see a Skip row".
  #
  # UNLIKE the procMount pair, this relaxation has no Restricted-tier sibling that re-tightens it:
  # PSS relaxes `runAsUser` for user-namespaced pods and leaves it relaxed at both profiles. There
  # is no `require-run-as-non-root-user-strict` and inventing one would mirror nothing.
  matchConditions:
  - name: skip-user-namespaced-pods
    # runAsNonRoot/runAsUser are skipped for pods in a user namespace -- root inside the
    # userns is unprivileged on the host, which is the property these checks exist to
    # guarantee.
    expression: "object.spec.?hostUsers.orValue(true) == true"
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # Pod-level `securityContext.runAsUser` plus all three container lists, mirroring
  # pod-security-admission's own `visitContainers()` on the container half.
  #
  # `.orValue(1)` IS A SENTINEL, NOT AN API DEFAULT, and this is the one place in the PSS family
  # where the house convention (`.orValue(<the API's own default>)`) has nothing to name:
  # `runAsUser` has no default, and an unset field means "whatever UID the image declares", which
  # PSS deliberately permits here (`check_runAsUser.go` only ever objects to an explicit 0). `1`
  # is the smallest value that satisfies the comparison and so encodes "absent is allowed"
  # directly. Any positive integer would do; do not read it as a claim that UID 1 is the default.
  #
  # `> 0` RATHER THAN `!= 0`, which is what PSS itself tests. The two are equivalent in practice
  # because core API validation already refuses a negative `runAsUser`, and `> 0` is what the
  # message below promises. Keeping the message and the expression in agreement is worth more
  # here than matching PSS's spelling of an unreachable case.
  - expression: >-
      object.spec.?securityContext.?runAsUser.orValue(1) > 0 &&
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?runAsUser.orValue(1) > 0)
    # Held stable per ../../best-practices/restrict-node-port.yaml's DEVIATION 2.
    message: >-
      Running as root is not allowed. The fields spec.securityContext.runAsUser,
      spec.containers[*].securityContext.runAsUser, spec.initContainers[*].securityContext.runAsUser,
      and spec.ephemeralContainers[*].securityContext.runAsUser must be unset or
      set to a number greater than zero.
