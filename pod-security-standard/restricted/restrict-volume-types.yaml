---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check restrictedVolumes
#
# `PSS-SNAPSHOT:` is this repo's marker on every PSS mirror: the release branch, policy version
# and `check_*.go` file this was last diffed against, so a resync has a fixed diff point. A
# greppable comment rather than an annotation, because a key invented inside upstream's
# `policies.kyverno.io/` namespace would collide with whatever upstream puts there later.
# `best-practices/` policies carry `PROVENANCE:` instead -- they mirror no external standard.
#
# LAYER 1 PURE MIRROR: the PSS rule, nothing about this estate. Every exemption this policy has
# in production lives in exemptions/restrict-volume-types.yaml, appended to
# `spec.matchConditions` by the `patches:` entry in kustomization.yaml. Read the two together
# before concluding this policy has no exemptions.
#
# House style is set by best-practices/restrict-node-port.yaml; read its header first. What the
# PSS family adds on top:
#
#   1. `spec.matchConditions: []` is present and EMPTY on every PSS mirror, even where no
#      exemption patch exists, because it is the seam the exemption layer appends to and a
#      JSON6902 append to a path whose parent is absent fails the kustomize build.
#   2. `spec.autogen.podControllers.controllers: []` on every PSS mirror. With autogen ON (the
#      default) Kyverno rewrites `object.` to `object.spec.template.` throughout the policy
#      INCLUDING `matchConditions`, so a metadata-based exemption silently stops matching real
#      controller-created Pods. Accepted cost: under `Deny`, a non-compliant Deployment is itself
#      admitted and only its Pods rejected.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-volume-types
  annotations:
    policies.kyverno.io/title: Restrict Volume Types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    # `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Tracks the Kubernetes minor in the PSS-SNAPSHOT line at the top of this file; move the two
    # together when resyncing against a newer Pod Security Standards revision.
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      In addition to restricting HostPath volumes, the restricted pod security profile
      limits usage of non-core volume types to those defined through PersistentVolumes.
      This policy blocks any other type of volume other than those in the allow list.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # A volume entry carries `name` plus exactly one source key, so "that source key is on the
  # list" is the whole rule. `.orValue([])` covers a Pod with no volumes; `.all()` also makes the
  # expression statically bool (see restrict-node-port.yaml's header for why that is required).
  #
  # Deliberately NOT the flattened form -- one list of every key of every volume, asserted to
  # hold nothing off the allow-list. That form needs `name` and `''` as allow-list members purely
  # to absorb the flattening, and sits one edit away from reading "if ANY key is allowed, pass",
  # which pod-image-and-hostpath-volume-fail.yaml in the CLI tier exists to catch.
  #
  # Continuation lines of a `>-` folded scalar sit at the SAME indent as the first line:
  # .yamllint sets `indentation.check-multi-line-strings`, which rejects a deeper continuation,
  # and a deeper line would not be folded at all -- YAML would keep the break inside the CEL
  # string. Carry structure with operator-at-end-of-line, never indentation.
  - expression: >-
      object.spec.?volumes.orValue([]).all(volume,
      has(volume.configMap) ||
      has(volume.csi) ||
      has(volume.downwardAPI) ||
      has(volume.emptyDir) ||
      has(volume.ephemeral) ||
      has(volume.image) ||
      has(volume.persistentVolumeClaim) ||
      has(volume.projected) ||
      has(volume.secret))
    message: >-
      Only the following types of volumes may be used: configMap, csi, downwardAPI,
      emptyDir, ephemeral, image, persistentVolumeClaim, projected, and secret.
  # `image` IS ALIGNMENT WITH UPSTREAM, NOT A LOCAL RELAXATION -- so it follows upstream back
  # out if reversed. Kubernetes' own pod-security-admission allows it under `restricted`
  # (`volume.Image != nil` in the allow-`continue` switch of policy/check_restrictedVolumes.go,
  # added by https://github.com/kubernetes/kubernetes/pull/130394 and not backported). This
  # allow-list mirrors that check, NOT the upstream Kyverno policy-library rule, which
  # transcribes an older PSS revision and omits `image`; resyncing from that library silently
  # reverts this entry.
  #
  # DO NOT "CORRECT" THIS AGAINST kubernetes.io. Its pod-security-standards page lists only the
  # original eight volume types and is stale, tracked as a docs bug in
  # https://github.com/kubernetes/website/issues/55370.
  #
  # Wanted here because it ships a binary into an egress-denied pod, which no other allowed
  # source can do: a ConfigMap cannot hold ~100MB, an emptyDir needs filling, and an
  # initContainer fetching it is bound by the same NetworkPolicy as the pod.
  #
  # The godoc on core/v1 `VolumeSource.Image` also promises noexec; that half has come and gone
  # between release branches, so do not build on it. Read-only is the stable half.
