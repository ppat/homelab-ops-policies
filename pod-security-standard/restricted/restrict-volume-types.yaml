---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check restrictedVolumes
#
# The `PSS-SNAPSHOT:` line above is this repo's snapshot marker convention for a Pod Security
# Standards mirror file (design doc phase2.0-policy-migration-design-v3.md §5, house discipline).
# It names the exact `kubernetes/kubernetes` release branch and pod-security-admission policy
# version this file was diffed against, and the `check_*.go` file it mirrors -- so the next
# person syncing against a newer PSS has a fixed diff point instead of a guess. It is a comment
# with a fixed greppable prefix rather than an annotation because §10.4 (making these
# machine-readable) is an explicitly-deferred follow-on, and inventing a key in upstream's
# `policies.kyverno.io/` annotation namespace to pre-empt it would be worse than a grep.
# `best-practices/` policies carry a `PROVENANCE:` comment instead (see restrict-node-port.yaml)
# -- they mirror no external standard, so there is no snapshot to pin.
#
# This is a LAYER 1 PURE MIRROR (design §2.1): it contains the PSS rule and nothing about this
# estate. Every exemption this policy has in production lives in
# exemptions/restrict-volume-types.yaml and is applied as a kustomize JSON6902 patch appending to
# `spec.matchConditions` -- see that file, and the `patches:` entry in kustomization.yaml. Read
# the two together before concluding this policy has no exemptions.
#
# House style is set by best-practices/restrict-node-port.yaml; read its header first. What this
# file adds on top of it, for the PSS family specifically:
#
#   1. `spec.matchConditions: []` is present and EMPTY on every PSS mirror, uniformly, even where
#      no exemption patch exists today. It is the seam the exemption layer appends to
#      (`op: add`, `path: /spec/matchConditions/-`); a JSON6902 append to a path whose parent is
#      absent fails the kustomize build. Confirmed accepted by the v1.18.2 CRD, and confirmed to
#      survive `kustomize build` verbatim when unpatched (Wave A1 spike §1).
#   2. `spec.autogen.podControllers.controllers: []` is set on every PSS mirror, uniformly
#      (design §2.4). With autogen ON -- the default -- Kyverno rewrites `object.` to
#      `object.spec.template.` throughout the policy INCLUDING `matchConditions`, so a
#      metadata-based exemption silently stops matching real controller-created Pods. Turning
#      autogen off makes that failure mode impossible rather than managing it per-policy. The
#      cost is recorded in §2.4: under a future `[Deny]` action a bad Deployment would be
#      admitted and only its Pods rejected.
#   3. The legacy `preconditions` block asserting `request.operation != DELETE` is DROPPED, not
#      translated: `matchConstraints.resourceRules[].operations: [CREATE, UPDATE]` already
#      excludes DELETE (design §1.2).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-volume-types
  annotations:
    policies.kyverno.io/title: Restrict Volume Types
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod,Volume
    # Bumped from 1.6.0: `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno
    # 1.17. The legacy `kyverno.io/kyverno-version` annotation this file used to also carry is
    # dropped as redundant with this one.
    policies.kyverno.io/minversion: 1.17.0
    # Was "1.22-1.23" on the legacy ClusterPolicy -- see the MIGRATION NOTE in the `image`
    # rationale below, which references that old value and whose reasoning depends on it.
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      In addition to restricting HostPath volumes, the restricted pod security profile
      limits usage of non-core volume types to those defined through PersistentVolumes.
      This policy blocks any other type of volume other than those in the allow list.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # One `has()` per allowed volume source, over every entry in `spec.volumes`. A volume entry
  # carries `name` plus exactly one source key, so "the source key is on the list" is the whole
  # rule. `.orValue([])` handles a Pod with no volumes at all (`.all()` over an empty list is
  # true), and `.all()` makes the expression statically bool -- see restrict-node-port.yaml's
  # header for why that matters.
  #
  # This replaces a JMESPath `deny.conditions` block that flattened `spec.volumes[].keys(@)[]`
  # into one list and used `AnyNotIn` against an allow-list that had to include `name` and `''`
  # as members to absorb the flattening. Per-volume `has()` needs neither, and cannot be misread
  # as "if ANY key is allowed, pass" -- the mis-edit that
  # ci/policy-tests/kyverno/restricted/restrict-volume-types/pod-image-and-hostpath-volume-fail.yaml
  # exists to catch.
  #
  # HOUSE STYLE, and the reason this reads flat rather than indented by nesting depth: every
  # continuation line of a `>-` folded scalar sits at the SAME indent as its first line. This
  # repo's .yamllint sets `indentation.check-multi-line-strings: true`, which rejects a
  # more-indented continuation line ("wrong indentation: expected 6 but found 8") -- and in a
  # folded scalar a more-indented line is also not folded at all, so YAML would silently keep
  # that line break inside the CEL string. Both reasons point the same way. Use blank
  # `#`-comment lines and operator-at-end-of-line to carry structure instead of indentation.
  - expression: >-
      object.spec.?volumes.orValue([]).all(volume,
      has(volume.configMap) ||
      has(volume.csi) ||
      has(volume.downwardAPI) ||
      has(volume.emptyDir) ||
      has(volume.ephemeral) ||
      has(volume.image) ||
      has(volume.persistentVolumeClaim) ||
      has(volume.projected) ||
      has(volume.secret))
    message: >-
      Only the following types of volumes may be used: configMap, csi, downwardAPI,
      emptyDir, ephemeral, image, persistentVolumeClaim, projected, and secret.
  # MIGRATION NOTE (Phase 2 kind migration), read before the block below. The rationale that
  # follows is ported VERBATIM from the legacy `ClusterPolicy` form of this policy and its
  # argument is unchanged and still correct. Exactly one of its premises moved: it says "This
  # policy is a Kyverno transcription of that profile as it stood at 1.22-1.23 (see the
  # kyverno.io/kubernetes-version annotation above), which simply predates the `image` volume
  # type". That was true of the legacy file. This file is a fresh mirror taken at k8s 1.36 / PSS
  # policy v1.35 (see PSS-SNAPSHOT at the top, and the now-"1.36" annotation), so `image` is
  # present here because the mirror is CURRENT -- the drift the block describes has been closed
  # at its source rather than patched over. Everything else below -- what `image` permits, what
  # it does not constrain, and what would make it wrong later -- is unaffected by the migration
  # and is the reason this block is retained in full rather than summarised.
  #
  # ALIGNMENT WITH UPSTREAM, NOT A LOCAL RELAXATION -- that is the whole justification
  # for this entry, so check it before treating it as a judgement call made here.
  # Kubernetes' own Pod Security Standards `restricted` profile permits `image` volumes
  # from 1.33 onward: `volume.Image != nil` sits in the allow-`continue` switch in
  # staging/src/k8s.io/pod-security-admission/policy/check_restrictedVolumes.go, added
  # by kubernetes/kubernetes#130394 ("Allow ImageVolume for Restricted PSA profiles",
  # SIG Auth, milestone v1.33, merged 2025-02-24, not backported -- absent on
  # release-1.31 and release-1.32, present on release-1.33 and later). This policy is a
  # Kyverno transcription of that profile as it stood at 1.22-1.23 (see the
  # kyverno.io/kubernetes-version annotation above), which simply predates the `image`
  # volume type (KEP-4639, alpha in 1.31): omitting it was drift from upstream rather
  # than a decision this cluster ever made. Because that makes this file no longer a
  # verbatim copy of the upstream Kyverno policy-library rule, do not resynchronise it
  # wholesale from that library -- that would silently revert this.
  #
  # DO NOT "CORRECT" THIS AGAINST THE PUBLISHED DOCS. kubernetes.io's
  # pod-security-standards page still lists only the original eight volume types -- it
  # is stale, and the admission code is what runs. Upstream agrees it is stale:
  # kubernetes/website#55370 is open and triage/accepted as a docs bug, citing #130394.
  # So expect that page to gain `image` eventually; that would confirm this entry
  # rather than challenge it.
  #
  # WHAT THIS PERMITS, PRECISELY -- the properties, not an assertion of safety. A mount
  # of an OCI image's (or OCI artifact's) filesystem, which the kubelet pulls and whose
  # manifest layers it merges the same way it does for a container image. So: (1) it is
  # read-only -- the godoc on core/v1 VolumeSource.Image (the field, not the
  # ImageVolumeSource type) reads "The volume will be mounted read-only (ro) and
  # non-executable files (noexec)." on release-1.33 through release-1.35, and drops the
  # noexec half on 1.36/master. Quote it from the branch you are actually running; the
  # read-only half is on every branch, and it is a kubelet/runtime guarantee about how
  # the mount is made, not something admission validates on the volumeMount; (2) it conveys
  # no host path, no host namespace and no device access, which is exactly what
  # separates it from hostPath and is why upstream was willing to allow it under
  # `restricted`; (3) it grants no reach a pod does not already have, because anything
  # that can name an image in spec.containers[].image can already run that same
  # filesystem -- that third point is upstream's own rationale on #130394. hostPath,
  # the source this policy exists to stop and the only one the PSS *baseline* profile
  # bothers to forbid, stays denied, as does everything else off this list.
  #
  # Its practical value, and why it is worth having cluster-wide rather than by
  # exception: it ships a binary into a pod that is denied internet egress, which no
  # other allowed volume type can do -- a ConfigMap cannot carry a ~100MB binary, an
  # emptyDir has to be filled by something, and an initContainer fetching it is subject
  # to the same NetworkPolicy as the pod it runs in.
  #
  # WHAT THIS ENTRY DOES NOT CONSTRAIN, and so stays a review discipline: WHICH image a
  # pod mounts. Nothing here requires the reference to be digest-pinned, so a mutable
  # tag can change under a pod between restarts. That is equally true of
  # spec.containers[].image and is not a property of this volume type, so it is no
  # argument for denying `image` here -- but if it ever matters it wants an admission
  # rule of its own rather than the removal of this entry.
  #
  # WHAT WOULD MAKE THIS WRONG LATER. The case above rests entirely on "it is a
  # container image pull, mounted read-only, with no host reachability", and it
  # survives none of the following. (1) A future Kubernetes release giving image
  # volumes write semantics or any form of host reachability -- that would require
  # revisiting this entry, not merely the workloads using it. (2) A reference syntax
  # that resolves to something the kubelet would not pull as a container image.
  # (3) Upstream reversing #130394 and dropping `image` back out of `restricted`: the
  # argument here is alignment, so this should follow upstream back out again.
