---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check
# allowPrivilegeEscalation
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape and CEL
# conventions) and ./restrict-volume-types.yaml (the PSS-mirror family: the `PSS-SNAPSHOT:`
# marker, the empty `matchConditions` seam, `autogen.podControllers.controllers: []`).
#
# This is a LAYER 1 PURE MIRROR: the estate exemption this policy has in production lives in
# ./exemptions/disallow-privilege-escalation.yaml. Read the two together.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privilege-escalation
  annotations:
    policies.kyverno.io/title: Disallow Privilege Escalation
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Tracks the Kubernetes minor in the PSS-SNAPSHOT line at the top of this file.
    kyverno.io/kubernetes-version: "1.36"
    policies.kyverno.io/description: >-
      Privilege escalation, such as via set-user-ID or set-group-ID file mode, should not be allowed.
      This policy ensures the `allowPrivilegeEscalation` field is set to `false`.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # THE LEADING WINDOWS DISJUNCT -- see ./disallow-capabilities-strict.yaml's validation comment
  # for the reasoning, which is not repeated here. `no_new_privs` is a Linux prctl, so the field
  # is meaningless on a Windows node and `allowPrivilegeEscalation_1_25()` returns `Allowed: true`
  # there.
  #
  # THE FIELD MUST BE EXPLICITLY `false` -- ABSENT IS A VIOLATION, which is the one thing to be
  # careful of when reading `.orValue(true)` here. It is the house convention working normally
  # (`.orValue()` supplies the value the API would have defaulted to) rather than an exception:
  # the kubelet's effective default is true, so an unset field means escalation IS allowed and PSS
  # requires the field to be present and false. "We never turn it on" is not compliance.
  #
  # All three container lists concatenated, mirroring pod-security-admission's own
  # `visitContainers()`.
  - expression: >-
      object.spec.?os.?name.orValue('') == 'windows' ||
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?allowPrivilegeEscalation.orValue(true) == false)
    # Held stable per ../../best-practices/restrict-node-port.yaml's DEVIATION 2. It names the
    # three field paths, which an Audit reader wants.
    message: >-
      Privilege escalation is disallowed. The fields
      spec.containers[*].securityContext.allowPrivilegeEscalation,
      spec.initContainers[*].securityContext.allowPrivilegeEscalation,
      and spec.ephemeralContainers[*].securityContext.allowPrivilegeEscalation
      must be set to `false`.
