---
# PSS-SNAPSHOT: k8s 1.36 / pod-security-admission policy version v1.35 / check
# procMount_restricted
#
# House style: ../../best-practices/restrict-node-port.yaml (ValidatingPolicy shape and CEL
# conventions) and ./restrict-volume-types.yaml (the PSS-mirror family: the `PSS-SNAPSHOT:`
# marker, the empty `matchConditions` seam, `autogen.podControllers.controllers: []`).
#
# MATCHED PAIR WITH ../baseline/disallow-proc-mount.yaml, AND NEITHER FILE IS COMPLETE ALONE.
# pod-security-admission implements procMount as two checks resolved against each other by its
# `OverrideCheckIDs` mechanism: `procMount_baseline` is RELAXED for pods in a user namespace,
# `procMount_restricted` re-tightens it unconditionally. The two mirrors differ in exactly one
# thing -- the sibling carries a `skip-user-namespaced-pods` matchCondition and this file does
# not -- which produces:
#
#   | pod                                 | baseline/disallow-proc-mount | this policy |
#   | ----------------------------------- | ---------------------------- | ----------- |
#   | `hostUsers: false` + `Unmasked`     | skip                         | fail        |
#   | `hostUsers` unset/true + `Unmasked` | fail                         | fail        |
#
# A cluster on the `baseline` profile gets the left column only; one on `restricted` gets both,
# and that is PSS's own arrangement rather than a duplication introduced here. All four outcomes
# are asserted rather than assumed: the second `Test` document in
# ci/policy-tests/kyverno/restricted/disallow-proc-mount-strict/kyverno-test.yaml runs both built
# policies over the same two fixture files.
#
# THIS IS THE HALF THAT CAN FLAG A LIVE `Unmasked`, which is the opposite of the intuitive reading
# of a Baseline/Restricted pair. The sibling's header carries the argument and it is not repeated
# here: on 1.36 the apiserver refuses `Unmasked` on every pod the Baseline check does not skip, so
# that half is inert at admission by construction. This policy is not belt-and-braces on top of it.
#
# NO ESTATE EXEMPTION, DELIBERATELY. A `hostUsers: false` workload that also sets a non-Default
# procMount will be flagged here, and the answer is a scoped entry through ./exemptions/ once such
# a workload exists and can be argued about concretely -- not a pre-emptive relaxation of the tier
# for a workload with no name, namespace or spec yet. The argument such an exemption would make --
# the kernel's own permission checks refuse dangerous /proc writes by a container root who is
# unprivileged on the host, which is the rationale for relaxing BASELINE -- excuses a workload; it
# does not excuse declining the Restricted check. In Audit mode the cost of being faithful is at
# most a report row that accurately says a pod deviates from PSS Restricted.
#
# NO CLUSTER-TIER TEST: the fixture that proves this rule is non-vacuous carries
# `procMount: Unmasked` WITHOUT `hostUsers: false`, which a 1.36 apiserver rejects outright, so
# Chainsaw cannot construct it and would see strictly less here than the CLI tier does.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-proc-mount-strict
  annotations:
    policies.kyverno.io/title: Disallow procMount (Strict)
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    # `policies.kyverno.io/v1 ValidatingPolicy` is first served by Kyverno 1.17.
    policies.kyverno.io/minversion: 1.17.0
    # Tracks the Kubernetes minor in the PSS-SNAPSHOT line at the top of this file.
    kyverno.io/kubernetes-version: "1.36"
    # ../baseline/disallow-proc-mount.yaml's description with the distinguishing clause appended
    # -- the same treatment the `message` below gets, and for the same reason: both policies can
    # fire on one pod, so the pair has to be tellable apart from the report alone.
    policies.kyverno.io/description: >-
      The default /proc masks are set up to reduce attack surface and should be required. This
      policy ensures nothing but the default procMount can be specified, including for pods in a
      user namespace, which the Baseline profile's equivalent policy exempts.
spec:
  autogen:
    podControllers:
      controllers: []
  evaluation:
    background:
      enabled: true
  # EMPTY ON PURPOSE -- this is the one line of the file that carries its meaning. Its Baseline
  # sibling ../baseline/disallow-proc-mount.yaml declares a `skip-user-namespaced-pods` entry
  # here; `procMount_restricted` has no such relaxation, so this list holds nothing but the
  # ordinary append seam every PSS mirror declares. Adding a hostUsers condition would not "align
  # the pair"; it would delete the policy's reason to exist.
  matchConditions: []
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validationActions:
  - Audit
  validations:
  # IDENTICAL, CHARACTER FOR CHARACTER, to ../baseline/disallow-proc-mount.yaml's expression: the
  # two checks differ in the relaxation, never in the test they apply. Keep them identical -- if
  # one is ever corrected, the other is wrong. All three container lists concatenated, mirroring
  # `visitContainers()`; `.orValue('Default')` reproduces "absent is allowed".
  - expression: >-
      (object.spec.containers +
      object.spec.?initContainers.orValue([]) +
      object.spec.?ephemeralContainers.orValue([])).all(c,
      c.?securityContext.?procMount.orValue('Default') == 'Default')
    # THE SIBLING'S MESSAGE WITH ONE CLAUSE APPENDED. This repo holds PolicyReport strings stable
    # (../../best-practices/restrict-node-port.yaml's DEVIATION 2); this policy has no report
    # history of its own, so the next-best thing is to stay parallel to the message it will appear
    # beside and add only what distinguishes the two.
    message: >-
      Changing the proc mount from the default is not allowed. The fields
      spec.containers[*].securityContext.procMount,
      spec.initContainers[*].securityContext.procMount,
      and spec.ephemeralContainers[*].securityContext.procMount must be unset or
      set to `Default`, including for pods in a user namespace.
