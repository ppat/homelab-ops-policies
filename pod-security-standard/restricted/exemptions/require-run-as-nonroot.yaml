---
# LAYER 2 -- ESTATE EXEMPTIONS for ../require-run-as-nonroot.yaml, applied by the `patches:` entry
# in ../kustomization.yaml. A JSON6902 patch document, NOT a manifest. House-style reference:
# ./restrict-volume-types.yaml, whose numbered conventions apply here unchanged.
#
# INDEPENDENT OF THE hostUsers SKIP in the pure mirror -- virt-handler does not set
# `spec.hostUsers: false`. See ./require-run-as-non-root-user.yaml's header note; the same applies
# here.

# Neither virt-handler's pod nor any of its containers sets `runAsNonRoot: true` anywhere -- it
# runs as root by design (see ../../baseline/exemptions/disallow-privileged-containers.yaml), so
# there is no partial-compliance path here to preserve. That is what distinguishes this entry from
# its sibling in ./require-run-as-non-root-user.yaml, where the exemption covers one init
# container in an otherwise-compliant pod and the pod-wide scope is a real cost. Here the whole
# DaemonSet is non-compliant on this field, so the pod-wide scope costs nothing beyond what the
# workload already is.
- op: add
  path: /spec/matchConditions/-
  value:
    name: exempt-virt-handler
    expression: >-
      !(object.metadata.?namespace.orValue('') == 'kubevirt' &&
      (object.metadata.?name.orValue('') + object.metadata.?generateName.orValue(''))
      .startsWith('virt-handler'))
