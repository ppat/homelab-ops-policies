---
# Cluster-tier test for `cleanup-empty-replicasets`. House style is set by
# ../../restricted/restrict-volume-types/chainsaw-test.yaml; read its header first, in particular
# the bar for adding a test here at all.
#
# THE CLAIMS THIS TIER OWNS AND THE CLI TIER CANNOT MAKE, one per step below:
#
#   1. A genuinely fresh, empty ReplicaSet survives a real cleanup cycle. `creationTimestamp` is
#      server-set, so only a live fixture can produce an object the 24h age guard has to leave
#      alone. The converse -- that an old enough one IS collected -- is unreachable here for the
#      same reason and stays CLI-tier only
#      (../../../kyverno/best-practices/cleanup-empty-replicasets/).
#   2. An empty ReplicaSet in `kube-system` is left alone while its twin in an ordinary namespace
#      is collected. The last step carries why that claim is unavailable offline and what has to
#      be neutralised on the cluster before it means anything.
#
# Neither tier repeats the other.
#
# WHY THIS TEST ALSO INSTALLS `cleanup-bare-pods`: "the fresh ReplicaSet still exists" is vacuous
# on its own -- it holds identically whether the cleanup controller ran a dozen cycles or never
# started. `cleanup-bare-pods` has no age guard, so a bare Pod created alongside the ReplicaSet
# is collected on the first cycle. Both policies are patched to the SAME fast schedule, so the
# Pod's disappearance is proof that a cycle for that schedule has already run by the time the
# ReplicaSet is checked -- which is what turns "still exists" into "survived".
#
# THE SUITE'S CLUSTER MUST NOT RUN THE CHART'S DEFAULT `resourceFilters`, or this test is vacuous
# the other way too: those defaults hide ReplicaSets from the engine entirely, so the policy would
# never see the fixture and "it survived" would again be true for the wrong reason. That override
# lives in .github/workflows/e2e-tests.yaml's Kyverno install, matching the estate's own values,
# because it is a premise of every test on this cluster rather than of any one of them. The last
# step lifts one further filter entry, which is the opposite case: a premise of a single claim,
# so it is lifted in the step that needs it and restored in that step's `finally`.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cleanup-empty-replicasets
spec:
  # `template: false` repo-wide -- see ../../restricted/restrict-volume-types/chainsaw-test.yaml.
  template: false
  steps:
  - name: precondition-replicasets-reach-the-engine
    # Fails loudly rather than letting everything below pass vacuously, which is what it would do
    # on a cluster left on the chart's defaults. The short timeout suits a static install-time
    # property; the suite-wide default would spend 90s re-reading a ConfigMap nothing is going to
    # change.
    try:
    - assert:
        timeout: 10s
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kyverno
            namespace: kyverno
          data:
            (contains(resourceFilters, '[ReplicaSet')): false

  - name: grant-permissions
    try:
    - apply:
        file: cluster-role.yaml

  - name: install-policies-and-speed-up-their-schedules
    try:
    - apply:
        file: ../../../.build/best-practices/cleanup-bare-pods.yaml
    - apply:
        file: ../../../.build/best-practices/cleanup-empty-replicasets.yaml
    # In-test only; the shipped schedules stay as both policy files author them. There is no
    # readiness gate before this the way ../../restricted/restrict-volume-types/ has one:
    # `DeletingPolicy` publishes no Ready signal to poll (see
    # ../../scripts/assert-built-profile-ready.sh), so the first successful cycle below is this
    # test's only readiness evidence, and it doubles as the behavioural assertion.
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: DeletingPolicy
          metadata:
            name: cleanup-bare-pods
          spec:
            schedule: "*/1 * * * *"
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: DeletingPolicy
          metadata:
            name: cleanup-empty-replicasets
          spec:
            schedule: "*/1 * * * *"

  - name: create-witness-and-survivor
    try:
    - apply:
        file: bare-pod-witness.yaml
    - apply:
        file: fresh-empty-replicaset.yaml
    - assert:
        file: fresh-empty-replicaset.yaml

  - name: a-cycle-runs-the-witness-is-cleaned-up-the-survivor-is-not
    try:
    # `*/1 * * * *` fires at the top of the next minute, which can be most of a minute after this
    # step starts, so the timeout has to comfortably clear one whole cycle rather than one
    # interval.
    - error:
        file: bare-pod-witness.yaml
        timeout: 2m30s
    # Ordering is the assertion: the step above has already established that a cycle ran on this
    # schedule, and cleanup-empty-replicasets shares it, so by now it has had its chance to
    # collect the ReplicaSet and declined.
    - assert:
        file: fresh-empty-replicaset.yaml

  - name: kube-system-survives-the-policys-own-exclusion-not-the-engines
    # THE SECOND CLAIM THIS TIER OWNS. It is here rather than beside the rest of the policy's
    # semantics in the CLI tier because whether `kyverno test` reports a
    # `matchConstraints.namespaceSelector` exclusion at all is CLI-version-dependent: newer CLIs
    # emit no result row for a resource the selector filtered out, and the file format has no
    # vocabulary for asserting that a row is absent.
    #
    # TWO THINGS MUST BE NEUTRALISED FIRST or "it survived" holds for the wrong reason:
    #
    #   1. THE ENGINE'S OWN `kube-system` FILTER. `[*/*,kube-system,*]` is in the chart's default
    #      `resourceFilters` and the estate keeps it, so every kube-system object is hidden from
    #      Kyverno upstream of any policy. Measured: with the selector deleted from the policy
    #      outright, the fixture below still survives while that entry is present -- the test
    #      would assert nothing. It is lifted here rather than at install time
    #      (.github/workflows/e2e-tests.yaml) because it is a premise of this one claim, not of
    #      the tier: lifting it cluster-wide would subject every other policy in the suite to a
    #      namespace no consumer exposes them to.
    #   2. EVERY OTHER CLEANUP POLICY. `cleanup-bare-pods` carries no namespace guard of its own
    #      -- it relies on that same filter -- so it is removed before the window opens, leaving
    #      the policy under test as the only one live inside it.
    #
    # The age guard is patched out so that a server-timestamped fixture can be a deletion
    # candidate at all; `matchConstraints`, the thing under test, is untouched. The
    # ordinary-namespace ReplicaSet disappearing is what proves a cycle ran under the relaxed
    # guard, and therefore that the kube-system one was considered and declined.
    try:
    - delete:
        ref:
          apiVersion: policies.kyverno.io/v1
          kind: DeletingPolicy
          name: cleanup-bare-pods
    - script:
        content: |
          set -eu
          filters=$(kubectl -n kyverno get configmap kyverno -o jsonpath='{.data.resourceFilters}')
          kept=$(printf '%s' "$filters" | tr ' ' '\n' | grep -Fxv '[*/*,kube-system,*]' | tr '\n' ' ')
          kubectl -n kyverno patch configmap kyverno --type merge -p "{\"data\":{\"resourceFilters\":\"$kept\"}}"
        check:
          ($error == null): true
    - apply:
        file: empty-replicaset-kube-system.yaml
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: DeletingPolicy
          metadata:
            name: cleanup-empty-replicasets
          spec:
            conditions:
            - name: is-empty
              expression: object.spec.?replicas.orValue(1) == 0
    - error:
        file: fresh-empty-replicaset.yaml
        timeout: 2m30s
    - assert:
        file: empty-replicaset-kube-system.yaml
    finally:
    # Runs whether the step passed or failed, so nothing downstream sees an engine configuration
    # no consumer runs. Idempotent, because the step may have failed before removing the entry.
    - script:
        content: |
          set -eu
          filters=$(kubectl -n kyverno get configmap kyverno -o jsonpath='{.data.resourceFilters}')
          case " $filters " in *' [*/*,kube-system,*] '*) exit 0 ;; esac
          restored="[*/*,kube-system,*] $filters"
          kubectl -n kyverno patch configmap kyverno --type merge -p "{\"data\":{\"resourceFilters\":\"$restored\"}}"
        check:
          ($error == null): true
