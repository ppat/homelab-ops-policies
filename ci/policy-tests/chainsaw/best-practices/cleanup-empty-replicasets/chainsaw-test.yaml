---
# Cluster-tier test for `cleanup-empty-replicasets`. House style is set by
# ../../restricted/restrict-volume-types/chainsaw-test.yaml; read its header first, in particular
# the bar for adding a test here at all.
#
# THE ONE CLAIM THIS TIER CAN MAKE AND THE CLI TIER CANNOT: a genuinely fresh, empty ReplicaSet
# survives a real cleanup cycle. `creationTimestamp` is server-set, so only a live fixture can
# produce an object the 24h age guard has to leave alone. The converse -- that an old enough one
# IS collected -- is unreachable here for the same reason and stays CLI-tier only
# (../../../kyverno/best-practices/cleanup-empty-replicasets/). Neither tier repeats the other.
#
# WHY THIS TEST ALSO INSTALLS `cleanup-bare-pods`: "the fresh ReplicaSet still exists" is vacuous
# on its own -- it holds identically whether the cleanup controller ran a dozen cycles or never
# started. `cleanup-bare-pods` has no age guard, so a bare Pod created alongside the ReplicaSet
# is collected on the first cycle. Both policies are patched to the SAME fast schedule, so the
# Pod's disappearance is proof that a cycle for that schedule has already run by the time the
# ReplicaSet is checked -- which is what turns "still exists" into "survived".
#
# THE SUITE'S CLUSTER MUST NOT RUN THE CHART'S DEFAULT `resourceFilters`, or this test is vacuous
# the other way too: those defaults hide ReplicaSets from the engine entirely, so the policy would
# never see the fixture and "it survived" would again be true for the wrong reason. The override
# lives in .github/workflows/e2e-tests.yaml's Kyverno install, matching the estate's own values,
# rather than in this test -- the ConfigMap holding it is chart-installed, so a test that patched
# it would be mutating cluster-wide state Chainsaw's cleanup does not track.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cleanup-empty-replicasets
spec:
  # `template: false` repo-wide -- see ../../restricted/restrict-volume-types/chainsaw-test.yaml.
  template: false
  steps:
  - name: precondition-replicasets-reach-the-engine
    # Fails loudly rather than letting everything below pass vacuously, which is what it would do
    # on a cluster left on the chart's defaults. The short timeout suits a static install-time
    # property; the suite-wide default would spend 90s re-reading a ConfigMap nothing is going to
    # change.
    try:
    - assert:
        timeout: 10s
        resource:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: kyverno
            namespace: kyverno
          data:
            (contains(resourceFilters, '[ReplicaSet')): false

  - name: grant-permissions
    try:
    - apply:
        file: cluster-role.yaml

  - name: install-policies-and-speed-up-their-schedules
    try:
    - apply:
        file: ../../../.build/best-practices/cleanup-bare-pods.yaml
    - apply:
        file: ../../../.build/best-practices/cleanup-empty-replicasets.yaml
    # In-test only; the shipped schedules stay as both policy files author them. There is no
    # readiness gate before this the way ../../restricted/restrict-volume-types/ has one:
    # `DeletingPolicy` publishes no Ready signal to poll (see
    # ../../scripts/assert-built-profile-ready.sh), so the first successful cycle below is this
    # test's only readiness evidence, and it doubles as the behavioural assertion.
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: DeletingPolicy
          metadata:
            name: cleanup-bare-pods
          spec:
            schedule: "*/1 * * * *"
    - patch:
        resource:
          apiVersion: policies.kyverno.io/v1
          kind: DeletingPolicy
          metadata:
            name: cleanup-empty-replicasets
          spec:
            schedule: "*/1 * * * *"

  - name: create-witness-and-survivor
    try:
    - apply:
        file: bare-pod-witness.yaml
    - apply:
        file: fresh-empty-replicaset.yaml
    - assert:
        file: fresh-empty-replicaset.yaml

  - name: a-cycle-runs-the-witness-is-cleaned-up-the-survivor-is-not
    try:
    # `*/1 * * * *` fires at the top of the next minute, which can be most of a minute after this
    # step starts, so the timeout has to comfortably clear one whole cycle rather than one
    # interval.
    - error:
        file: bare-pod-witness.yaml
        timeout: 2m30s
    # Ordering is the assertion: the step above has already established that a cycle ran on this
    # schedule, and cleanup-empty-replicasets shares it, so by now it has had its chance to
    # collect the ReplicaSet and declined.
    - assert:
        file: fresh-empty-replicaset.yaml
