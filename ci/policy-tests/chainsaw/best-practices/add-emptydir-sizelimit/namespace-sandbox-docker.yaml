---
# The virt-launcher exemption is scoped by REAL namespace name, so the test has to create that
# namespace rather than use chainsaw's generated per-test one. Same reasoning (and the same
# reason every test in this repo sets `template: false` and hardcodes names) as
# ../../restricted/restrict-volume-types/namespace-kubevirt.yaml.
#
# `sandbox-docker` and not `kubevirt`: virt-launcher pods run in the VM's OWN namespace, which is
# the correction the policy file's verbatim eviction-loop comment makes and the reason a
# `kubevirt`-scoped exclusion would have excluded nothing.
#
# Chainsaw deletes what it applied, so this namespace is torn down with the test.
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox-docker
