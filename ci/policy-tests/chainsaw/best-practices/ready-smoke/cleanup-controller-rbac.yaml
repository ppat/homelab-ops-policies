---
# TEST-LOCAL ONLY -- this ClusterRole is NOT part of what this repo ships. It mirrors
# `kyverno:cleanup-controller:additional`, which lives in the ESTATE, not here:
# homelab-ops-kubernetes-apps, infrastructure/subsystems/security-core/kyverno/rbac.yaml. That
# cross-repo pointer is the whole reason this file carries a comment -- if the estate's grant
# ever narrows, this test keeps passing while the real cluster stops cleaning up, and the only
# way anyone finds that is by having been told where to look.
#
# WHY THE TEST NEEDS IT AT ALL, measured against a stock `kyverno/kyverno` chart install:
# creating a `ClusterCleanupPolicy` or `DeletingPolicy` that deletes a kind the cleanup
# controller cannot delete is REJECTED AT ADMISSION, not merely left un-Ready --
#   Error from server: admission webhook "kyverno-cleanup-controller.kyverno.svc" denied the
#   request: cleanup controller has no permission to delete kind Pod
# -- so without this ClusterRole the `apply:` step of the best-practices ready-smoke fails
# outright and never reaches the readiness assertion. The chart's own aggregated cleanup role
# does not cover pods or replicasets; the `rbac.kyverno.io/aggregate-to-cleanup-controller` label
# is what pulls these rules into it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-cleanup-controller-policy-tests
  labels:
    rbac.kyverno.io/aggregate-to-cleanup-controller: "true"
rules:
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - watch
  - list
  - delete
- apiGroups:
  - apps
  resources:
  - replicasets
  verbs:
  - get
  - watch
  - list
  - delete
