---
# Readiness assertion for disallow-host-probes-and-lifecycle. Same shape and same reasoning as
# ../../restricted/restrict-volume-types/policy-ready.yaml, which is the house-style reference:
# it records where the condition names came from and why the `(conditions[?type == 'X'])` filter
# form is what keeps each arm non-vacuous.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-host-probes-and-lifecycle
status:
  conditionStatus:
    ready: true
    (conditions[?type == 'WebhookConfigured']):
    - status: "True"
      reason: Succeeded
    (conditions[?type == 'RBACPermissionsGranted']):
    - status: "True"
      reason: Succeeded
