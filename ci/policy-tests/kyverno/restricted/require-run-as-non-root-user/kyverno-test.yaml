---
# CLI tier for require-run-as-non-root-user. House-style references:
# ../../best-practices/restrict-node-port/kyverno-test.yaml (the conventions for this tier),
# ../restrict-volume-types/kyverno-test.yaml (why an exemption-carrying policy needs a built
# document and a pure one) and ../../baseline/disallow-privileged-containers/kyverno-test.yaml
# (the `<namespace>/<name>` fixture-collision rule). None of them is restated.
#
# THIS SUITE ASSERTS TWO DIFFERENT KINDS OF `skip` AND THE DIFFERENCE IS THE POINT.
#
#   * The `default/...userns...` rows are PSS SEMANTICS: the standard skips `runAsUser` entirely
#     for a pod in a user namespace. That condition lives in the PURE MIRROR, so those rows read
#     `skip` in BOTH documents below.
#   * The two `kubevirt/...` rows are an ESTATE EXEMPTION. That lives in the patch layer, so those
#     rows read `skip` in the `built` document and `fail` in the `pure` one.
#
# A single suite that conflated the two would still go green if the userns condition were misfiled
# into exemptions/ -- where a consumer could later relocate it away as though it were this
# estate's decision -- or if the virt-handler exemption leaked into the mirror. Asserting them in
# both documents is what separates them.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-run-as-non-root-user-built
policies:
- ../../../.build/restricted/require-run-as-non-root-user.yaml
resources:
- pod-container-runasuser-zero-fail.yaml
- pod-podlevel-runasuser-zero-fail.yaml
- pod-runasuser-nonzero-pass.yaml
- pod-no-runasuser-pass.yaml
- pod-init-container-runasuser-zero-fail.yaml
- pod-ephemeral-container-runasuser-zero-fail.yaml
- pod-hostusers-false-runasuser-zero-skip.yaml
- pod-hostusers-true-runasuser-zero-fail.yaml
- pod-hostusers-false-runasuser-nonzero-skip.yaml
- pod-virt-handler-runasuser-zero-skip.yaml
- pod-virt-handler-generatename-runasuser-zero-skip.yaml
- pod-not-virt-handler-in-kubevirt-runasuser-zero-fail.yaml
- pod-virt-handler-name-outside-kubevirt-runasuser-zero-fail.yaml
results:
- policy: require-run-as-non-root-user
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/compliant-workload-6b9f4c8d5-x2kqp
  - default/unset-runasuser-workload-844d7c96b-fq8vn
  result: pass
- policy: require-run-as-non-root-user
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/ordinary-workload-5f7d9b46c-tn4wq
  - default/podlevel-root-workload-cbf5bd649-mzqns
  - default/sidecar-workload-77955b8c45-52ls7
  - default/debugged-workload-5687cbcbf5-bkswh
  - default/explicit-hostusers-workload-7d4c9f8b6-lq2mn
  - kubevirt/virt-api-6d9c8f5b7-9wq4x
  - monitoring/virt-handler-zzz11
  result: fail
# Both kinds of `skip` together, which is what a consumer of the built stream actually sees. The
# `pure` document below is what tells them apart.
- policy: require-run-as-non-root-user
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/userns-workload-9b966fd69-bsmhz
  - default/compliant-userns-workload-fd4b5c598-pv8pn
  - kubevirt/virt-handler-54dpv
  - kubevirt/
  result: skip
---
# The exemption layer removed. Same fixtures, same selectors; only `policies:` differs.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-run-as-non-root-user-pure
policies:
- ../../../../../pod-security-standard/restricted/require-run-as-non-root-user.yaml
resources:
- pod-container-runasuser-zero-fail.yaml
- pod-podlevel-runasuser-zero-fail.yaml
- pod-runasuser-nonzero-pass.yaml
- pod-no-runasuser-pass.yaml
- pod-init-container-runasuser-zero-fail.yaml
- pod-ephemeral-container-runasuser-zero-fail.yaml
- pod-hostusers-false-runasuser-zero-skip.yaml
- pod-hostusers-true-runasuser-zero-fail.yaml
- pod-hostusers-false-runasuser-nonzero-skip.yaml
- pod-virt-handler-runasuser-zero-skip.yaml
- pod-virt-handler-generatename-runasuser-zero-skip.yaml
- pod-not-virt-handler-in-kubevirt-runasuser-zero-fail.yaml
- pod-virt-handler-name-outside-kubevirt-runasuser-zero-fail.yaml
results:
- policy: require-run-as-non-root-user
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/compliant-workload-6b9f4c8d5-x2kqp
  - default/unset-runasuser-workload-844d7c96b-fq8vn
  result: pass
# THE FIRING ASSERTION for the estate exemption: the two virt-handler pods, which the built policy
# skips, are real violations of the pure mirror.
- policy: require-run-as-non-root-user
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/ordinary-workload-5f7d9b46c-tn4wq
  - default/podlevel-root-workload-cbf5bd649-mzqns
  - default/sidecar-workload-77955b8c45-52ls7
  - default/debugged-workload-5687cbcbf5-bkswh
  - default/explicit-hostusers-workload-7d4c9f8b6-lq2mn
  - kubevirt/virt-api-6d9c8f5b7-9wq4x
  - monitoring/virt-handler-zzz11
  - kubevirt/virt-handler-54dpv
  - kubevirt/
  result: fail
# STILL `skip` WITHOUT THE EXEMPTION LAYER. These are the rows that prove the userns condition is
# PSS semantics living in the mirror, not an estate decision living in a patch. Move it to
# exemptions/require-run-as-non-root-user.yaml and they turn `fail` here while staying green in
# the `built` document above -- which is why the pair is asserted rather than just the built
# half.
- policy: require-run-as-non-root-user
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/userns-workload-9b966fd69-bsmhz
  - default/compliant-userns-workload-fd4b5c598-pv8pn
  result: skip
