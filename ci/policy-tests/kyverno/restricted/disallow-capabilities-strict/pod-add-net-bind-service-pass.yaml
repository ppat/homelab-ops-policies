---
# EXPECTED: `pass`. The one permitted addition, which is the whole content of this policy's
# allow-list. Its twin ../require-drop-all/pod-drop-all-add-net-bind-service-pass.yaml asserts the
# same shape from the drop-ALL half.
apiVersion: v1
kind: Pod
metadata:
  name: netbind-workload-6b9f4c8d5-x2kqp
  namespace: default
spec:
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    securityContext:
      capabilities:
        drop:
        - ALL
        add:
        - NET_BIND_SERVICE
