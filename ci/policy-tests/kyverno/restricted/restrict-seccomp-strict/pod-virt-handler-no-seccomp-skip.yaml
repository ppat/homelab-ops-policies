---
# EXPECTED: `skip` against built output, `fail` against the pure mirror.
#
# ESTATE EXEMPTION 1 OF 2 FIRING: virt-handler in `kubevirt`. Non-vacuous by construction -- it
# sets no seccompProfile at either level, which is a real violation, so `skip` is attributable to
# the exemption and nothing else.
apiVersion: v1
kind: Pod
metadata:
  name: virt-handler-54dpv
  namespace: kubevirt
spec:
  containers:
  - name: virt-handler
    image: registry.k8s.io/pause:3.10
    securityContext:
      privileged: true
