---
# EXPECTED: `pass` against the built policy, `pass` against the pure mirror.
#
# Same claim as pod-image-volume-pass.yaml, in a second namespace under a second name. Two
# fixtures sharing no name and no namespace are what distinguish "`image` is allowed globally"
# from "`image` is allowed by some name-and-namespace-scoped exemption" -- one fixture cannot.
# `monitoring` matches no exemption in this repo; nothing else here is specific to it.
apiVersion: v1
kind: Pod
metadata:
  name: unrelated-workload-844d7c96b-fq8vn
  namespace: monitoring
spec:
  restartPolicy: Never
  containers:
  - name: tools
    image: docker.io/curlimages/curl:8.21.0
    volumeMounts:
    - name: talosctl-bin
      mountPath: /opt/talosctl
      readOnly: true
  volumes:
  - name: talosctl-bin
    image:
      reference: ghcr.io/siderolabs/talosctl:v1.13.7
      pullPolicy: IfNotPresent
