# iterates all three lists identically, so the mirror concatenates them.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-workload-77955b8c45-52ls7
  namespace: default
spec:
  initContainers:
  - name: log-rotate
    image: registry.k8s.io/pause:3.10
    restartPolicy: Always
    securityContext:
      procMount: Unmasked
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    securityContext:
      procMount: Default
