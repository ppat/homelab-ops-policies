---
# EXPECTED: `pass` -- and the contrast with `skip` is the point.
#
# A user-namespaced pod that is compliant anyway. The Baseline sibling reports `skip` on this
# shape (its matchCondition filters the pod out before the rule runs); this policy reports `pass`
# (the rule ran and the pod satisfied it). Together the two rows show that the Restricted policy
# has no matchCondition at all rather than merely a different one -- a `skip` here would mean the
# userns relaxation had been copied into this file, which would delete its reason to exist.
apiVersion: v1
kind: Pod
metadata:
  name: strict-compliant-userns-workload-9f3b5d7c2-jm4pv
  namespace: default
spec:
  hostUsers: false
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    securityContext:
      procMount: Default
