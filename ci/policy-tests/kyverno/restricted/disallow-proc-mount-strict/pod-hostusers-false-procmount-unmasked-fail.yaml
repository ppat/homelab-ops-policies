---
# EXPECTED: `fail` -- WHICH IS THE ENTIRE REASON THIS POLICY EXISTS.
#
# Its Baseline sibling SKIPS this exact pod shape: PSS v1.35 relaxes `procMount_baseline` for pods
# in a user namespace. `procMount_restricted` re-tightens it unconditionally, so the Restricted
# mirror declares `matchConditions: []` where the Baseline one declares a
# `skip-user-namespaced-pods` entry, and the same pod reads Baseline `skip` / Restricted `fail`.
# That composition is PSS's own `OverrideCheckIDs` resolution and it is asserted directly, on the
# Baseline suite's own fixture files, by the second `Test` document in ./kyverno-test.yaml -- this
# fixture is the same shape kept locally so this directory stands alone.
#
# THIS IS ALSO THE ONLY SHAPE IN THIS DIRECTORY A 1.36 APISERVER WOULD ACCEPT (Wave A1 spike §7:
# `Unmasked` requires `hostUsers: false`). Which means this policy is the only one of the pair
# that can flag a live `Unmasked` -- the Baseline half is inert at admission by construction on
# 1.36. Do not restate that as "the apiserver may already reject this".
apiVersion: v1
kind: Pod
metadata:
  name: strict-userns-workload-2c8e6a1b4-wr7tk
  namespace: default
spec:
  hostUsers: false
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    securityContext:
      procMount: Unmasked
