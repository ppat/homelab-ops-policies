---
# CLI-tier test for add-ndots. Conventions: ../restrict-node-port/kyverno-test.yaml (1-5) and
# ../add-default-resources/kyverno-test.yaml (6-10, the MutatingPolicy additions).
#
# THE CLAIM THIS SUITE DEFENDS: `add-ndots` sets ndots to 1 for workloads that did not choose a
# value, and NEVER changes one that did. This repo has already had one real bug in that exact
# area (Phase 1), and upstream kyverno/policies' own mpol rewrite of this policy deliberately
# does the wrong thing here -- it removes the workload's entry before adding its own -- so
# "someone syncs with upstream" is a live, concrete way for the guarantee to be lost. Two `skip`
# fixtures with a declared ndots, and one `pass` fixture whose sibling options must survive, are
# what make that loud.
#
# NO POD-CONTROLLER FIXTURES, for the two reasons set out in ../add-emptydir-sizelimit/'s header:
# this tier cannot assert the absence of a match, and it models pod controllers wrongly (it
# simulates an autogen rewrite a real cluster does not perform). For THIS policy the second
# reason is sharper than for its siblings -- with autogen on, the simulated rewrite leaves the
# JSON-Pointer patch path untranslated and produces a top-level `Deployment.spec.dnsConfig`, a
# field apps/v1 does not have. The cluster tier carries it:
# ../../../chainsaw/best-practices/add-ndots/ applies a real Deployment and asserts the controller
# object was NOT rewritten while its Pod WAS.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: add-ndots
policies:
- ../../../.build/best-practices/add-ndots.yaml
resources:
- pod-no-dnsconfig-mutated.yaml
- pod-dnsconfig-without-options-mutated.yaml
- pod-sibling-options-preserved-mutated.yaml
- pod-own-ndots-skip.yaml
- pod-own-ndots-among-siblings-skip.yaml
- pod-dns-skip.yaml
- pod-kube-system-skip.yaml
- pod-longhorn-system-skip.yaml
- pod-metallb-system-skip.yaml
results:
# The three shapes the mutation has to handle: no dnsConfig, dnsConfig without options, and
# dnsConfig with other people's options. Which arm of the conditional each one takes, and what
# survives, is entirely in patched-resources.yaml.
- policy: add-ndots
  isMutatingPolicy: true
  kind: Pod
  resources:
  - default/ndots-plain-workload
  - default/ndots-nameservers-workload
  - default/ndots-sibling-options-workload
  patchedResources: patched-resources.yaml
  failOnMissingResources: true
  result: pass
# The idempotence guard, both positions. `skip`, not `pass`: the Pod must be filtered out before
# the mutation runs, not patched to the same bytes.
- policy: add-ndots
  isMutatingPolicy: true
  kind: Pod
  resources:
  - default/ndots-declared-workload
  - default/ndots-declared-among-siblings-workload
  result: skip
# All four exempt namespaces, one fixture each so any single one can be dropped from
# `['dns', 'kube-system', 'longhorn-system', 'metallb-system']` and noticed. Each fixture
# declares no dnsConfig, so each is a real target of the rule.
- policy: add-ndots
  isMutatingPolicy: true
  kind: Pod
  resources:
  - dns/ndots-dns-workload
  - kube-system/ndots-kube-workload
  - longhorn-system/ndots-longhorn-workload
  - metallb-system/ndots-metallb-workload
  result: skip
