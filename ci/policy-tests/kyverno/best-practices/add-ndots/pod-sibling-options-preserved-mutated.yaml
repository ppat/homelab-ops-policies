---
# EXPECTED: `pass`, mutated -- ndots APPENDED, `edns0` and `attempts` still present.
#
# THE REGRESSION FIXTURE FOR THIS REPO'S OWN NDOTS CLOBBERING BUG. `spec.dnsConfig.options` is
# declared `listType: atomic`: it has no merge key, so anything that writes it writes the WHOLE
# list. Two opposite mistakes both land on this exact Pod shape -- a guard that tests only for the
# presence of `options` skips it and leaves ndots absent, and a mutation that writes the list
# without reading it back first deletes the workload's own resolver options. patched-resources.yaml
# pins all three entries and their order.
#
# Upstream kyverno/policies' mpol does not have this problem in this shape, but has a worse one
# in another: it explicitly REMOVES an existing ndots option before adding its own.
apiVersion: v1
kind: Pod
metadata:
  name: ndots-sibling-options-workload
  namespace: default
spec:
  dnsConfig:
    options:
    - name: edns0
    - name: attempts
      value: "3"
  containers:
  - name: app
    image: nginx:1.29
