---
# EXPECTED: `skip`.
#
# THE EVICTION-LOOP REGRESSION, AT THE CLI TIER. This is the shape that caused the incident the
# policy file's verbatim comment describes: a virt-launcher Pod in a VM namespace whose
# `ephemeral-disks` emptyDir is the containerDisk copy-on-write overlay backing every write the
# guest makes to its root filesystem. A 256Mi cap on it evicts the VM, the VM restarts, and it
# evicts again -- with nothing reported anywhere, because a mutate rule does not report.
#
# `name` AND `generateName` both present, which is the shape a live controller-created Pod
# actually arrives in at admission (measured, see
# ../../../../pod-security-standard/restricted/exemptions/restrict-volume-types.yaml). The
# name-only and generateName-only shapes are covered by
# pod-virt-launcher-sandbox-talos-generatename-skip.yaml.
#
# Non-vacuous: the emptyDir is plain, disk-backed and uncapped, so this Pod is a real target of
# the rule.
apiVersion: v1
kind: Pod
metadata:
  name: virt-launcher-vmdocker-x9k2p
  generateName: virt-launcher-vmdocker-
  namespace: sandbox-docker
spec:
  containers:
  - name: compute
    image: quay.io/kubevirt/virt-launcher:v1.9.0
  volumes:
  - name: ephemeral-disks
    emptyDir: {}
