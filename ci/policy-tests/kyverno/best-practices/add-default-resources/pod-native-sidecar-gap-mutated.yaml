---
# EXPECTED: `pass`, mutated -- and the initContainers left UNTOUCHED.
#
# THIS FIXTURE ASSERTS A KNOWN GAP, ON PURPOSE. It is not a bug report waiting to be fixed by
# whoever reads it next; it is the executable record of design doc
# phase2.0-policy-migration-design-v3.md §5.7, which says the native-sidecar gap in
# add-default-resources is to be NOTED in-file and fixed in a separate follow-up, never as part
# of the kind migration ("a behaviour change must not ride on a kind migration or its
# regressions become unattributable").
#
# `logs` is a NATIVE SIDECAR: an entry in `spec.initContainers` carrying
# `restartPolicy: Always`, GA since Kubernetes 1.33. It runs for the whole life of the Pod and
# counts toward the Pod's QoS class and scheduling footprint exactly the way `app` does -- and
# it gets no default request, because the mutation reaches `spec.containers` and nothing else.
# `setup` is a plain init container and is equally untouched.
#
# The gap predates this migration: the legacy rule's `foreach` iterated
# `[ephemeralContainers, initContainers, containers][]` and then patched `spec.containers`, so
# the two extra lists were traversed and discarded. The port makes that explicit rather than
# preserving a misleading traversal.
#
# WHEN THE FOLLOW-UP LANDS, this fixture is what it edits: move the expectation in
# patched-resources.yaml so `logs` gains `requests`, and the assertion flips from documenting the
# gap to documenting the fix. Deleting the fixture instead would lose the only place the estate
# records that plain init containers are a deliberate non-target too.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-workload
  namespace: default
spec:
  initContainers:
  - name: setup
    image: busybox:1.37
  - name: logs
    image: busybox:1.37
    restartPolicy: Always
  containers:
  - name: app
    image: nginx:1.29
