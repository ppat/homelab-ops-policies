---
# THE EXPECTED OUTPUT OF THE MUTATION, and therefore the actual assertion of this directory.
#
# For a `ValidatingPolicy` the assertion is a verdict -- `pass`/`fail`/`skip` -- and the fixture
# file is the whole story. For a `MutatingPolicy` the verdict says only "a patch was produced";
# WHAT it produced is compared against the documents below, named by `patchedResources:` on each
# expected-`pass` row of kyverno-test.yaml. A row without `patchedResources` asserts almost
# nothing, which for a policy that rewrites live objects with no Audit backstop is not enough.
#
# Documents are matched to fixtures by kind + namespace + name, so every name here must
# correspond to exactly one fixture. Ordering is irrelevant; the order below follows
# kyverno-test.yaml's rows for readability.
#
# Generated by running the built policy over the fixtures and then READ, line by line, against
# what each fixture's header claims -- not pasted in and trusted. If a future change makes one of
# these stale, regenerate with:
#   kyverno apply ../../../.build/best-practices/add-default-resources.yaml \
#     --resource <fixture>.yaml -o <dir>
# and then re-read the result before committing it.

# ---------------------------------------------------------------------------------------------
# From pod-no-requests-mutated.yaml. Both containers gain both defaults. 32Mi/32m, NOT upstream
# kyverno/policies' 100Mi/100m -- this estate's numbers are the policy.
apiVersion: v1
kind: Pod
metadata:
  name: besteffort-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: app
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  - image: nginx:1.29
    name: sidecar-ish
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
---
# From pod-declared-requests-preserved.yaml. THE LOAD-BEARING DOCUMENT OF THIS FILE:
#   * `requests.cpu` is still 500m -- the declared value was NOT replaced by 32m;
#   * `requests.memory` is 32Mi -- the missing value WAS added;
#   * `limits.memory` is still 1Gi -- an apply configuration naming only `requests` did not
#     take the sibling map with it.
# A policy that wrote both defaults unconditionally would differ here and only here.
apiVersion: v1
kind: Pod
metadata:
  name: partially-sized-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: app
    resources:
      limits:
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 32Mi
---
# From pod-declared-memory-preserved.yaml. The OTHER half of the load-bearing pair: `memory` is
# still 512Mi and `cpu` was added at 32m. Its sibling above falsifies the cpu axis; this one
# falsifies the memory axis. Both are needed -- the suite was mutation-tested with only the
# first, and a policy rewritten to overwrite memory unconditionally stayed green.
apiVersion: v1
kind: Pod
metadata:
  name: memory-sized-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: app
    resources:
      requests:
        cpu: 32m
        memory: 512Mi
---
# From pod-native-sidecar-gap-mutated.yaml. THE DOCUMENTED GAP, asserted rather than described:
# `app` gains the defaults; `logs` -- an initContainer with `restartPolicy: Always`, i.e. a
# native sidecar, which runs for the Pod's whole lifetime -- does NOT, and neither does the plain
# init container `setup`. Design §5.7 requires this be noted and NOT fixed during the kind
# migration; see the fixture header for what the follow-up edits when it lands.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: app
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  initContainers:
  - image: busybox:1.37
    name: setup
  - image: busybox:1.37
    name: logs
    restartPolicy: Always
