---
# THE EXPECTED OUTPUT OF THE MUTATION, and therefore half the assertion of this directory. The
# other half is the `skip` rows in kyverno-test.yaml, which pin the containers this policy must not
# touch; a verdict is the only thing that distinguishes "left alone by the gate" from "rewritten
# with the value it already had", since both produce an identical object.
#
# For a `ValidatingPolicy` the assertion is a verdict -- `pass`/`fail`/`skip` -- and the fixture
# file is the whole story. For a `MutatingPolicy` the verdict says only "a patch was produced";
# WHAT it produced is compared against the documents below, named by `patchedResources:` on each
# expected-`pass` row of kyverno-test.yaml.
#
# Documents are matched to fixtures by kind + namespace + name, so every name here must
# correspond to exactly one fixture. Ordering is irrelevant; the order below follows
# kyverno-test.yaml's rows for readability.
#
# Generated by running the built policy over the fixtures and then READ, line by line, against
# what each fixture's header claims -- not pasted in and trusted. If a future change makes one of
# these stale, regenerate with:
#   kyverno apply ../../../.build/best-practices/add-default-resources.yaml \
#     --resource <fixture>.yaml -o <dir>
# and then re-read the result before committing it.

# ---------------------------------------------------------------------------------------------
# From pod-no-requests-mutated.yaml. Both containers gain both defaults. 32Mi/32m, NOT upstream
# kyverno/policies' 100Mi/100m -- this estate's numbers are the policy.
apiVersion: v1
kind: Pod
metadata:
  name: besteffort-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: app
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  - image: nginx:1.29
    name: sidecar-ish
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
---
# From pod-mixed-container-resources-mutated.yaml. THE LOAD-BEARING DOCUMENT OF THIS FILE: the gate
# resolved per container within one Pod.
#   * `sized` is byte-for-byte its input -- 500m and 512Mi, neither replaced by a default;
#   * `unsized` gained both defaults.
# A mutation whose `map()` ran over every container rather than over the `filter()`ed selection
# would differ here and only here, and it would differ downward in both fields.
apiVersion: v1
kind: Pod
metadata:
  name: mixed-container-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: sized
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
  - image: nginx:1.29
    name: unsized
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
---
# From pod-empty-resources-mutated.yaml. An explicit `resources: {}` is the shape every container
# has by the time a live API server forwards it, and it must be treated as "declares nothing": the
# defaults land. See the fixture header for the gate arm this pins.
apiVersion: v1
kind: Pod
metadata:
  name: empty-resources-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: app
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
---
# From pod-native-sidecar-gap-mutated.yaml. THE DOCUMENTED GAP, asserted rather than described:
# `app` gains the defaults; `logs` -- an initContainer with `restartPolicy: Always`, i.e. a native
# sidecar, which runs for the Pod's whole lifetime -- does NOT, and neither does the plain init
# container `setup`. See the fixture header for why the gap is deliberate and what closing it
# would edit.
apiVersion: v1
kind: Pod
metadata:
  name: sidecar-workload
  namespace: default
spec:
  containers:
  - image: nginx:1.29
    name: app
    resources:
      requests:
        cpu: 32m
        memory: 32Mi
  initContainers:
  - image: busybox:1.37
    name: setup
  - image: busybox:1.37
    name: logs
    restartPolicy: Always
