---
# EXPECTED: `skip`.
#
# The `virt-launcher*` exemption, in `sandbox-talos` (its other namespace is covered by
# ./deployment-virt-launcher-sandbox-docker-skip.yaml).
#
# DELIBERATELY SYNTHETIC, and labelled as such so nobody mistakes it for estate reality: the
# exemption it exercises has nothing in the estate to fire on -- see the `exempt-virt-launcher`
# note in ../../../../../best-practices/exemptions/require-probes.yaml.
#
# This fixture is what keeps the retained expression HONEST rather than merely present. A
# `virt-launcher`-prefixed StatefulSet exists nowhere but this directory, but it exercises exactly
# the predicate the policy carries, so a mistyped expression -- wrong namespace list, `==` instead
# of `startsWith`, a lost `generateName` term -- turns this row red instead of sitting undetected
# behind an exemption that never fires. Its non-vacuous twin is the `default`-namespace unprobed
# StatefulSet ./statefulset-no-probes-fail.yaml.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: virt-launcher-talos-vm
  namespace: sandbox-talos
spec:
  serviceName: virt-launcher-talos-vm
  selector:
    matchLabels:
      app: virt-launcher-talos-vm
  template:
    metadata:
      labels:
        app: virt-launcher-talos-vm
    spec:
      containers:
      - name: compute
        image: registry.internal/virt-launcher:v1.6.0
