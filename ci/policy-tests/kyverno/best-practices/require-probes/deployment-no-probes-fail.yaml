---
# EXPECTED: `fail`.
#
# THE CORE ASSERTION OF THE REDESIGN, kind 1 of 3. Under the legacy `ClusterPolicy` a Deployment
# was only reached because `pod-policies.kyverno.io/autogen-controllers` synthesised a rule for
# it; here the Deployment is matched DIRECTLY by `matchConstraints` and the expression reads
# `object.spec.template.spec.containers` as written. A `fail` on this fixture with
# `spec.autogen.podControllers.controllers: []` set in the policy is what proves the direct match
# works on its own, with no rewrite involved.
#
# Two containers, both unprobed, so the adopted `messageExpression` has something to enumerate:
# the reported message must name BOTH `api` and `metrics-exporter`. Read it off the
# `--detailed-results` table -- `kyverno test` rows cannot assert on message text.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-server
  namespace: default
spec:
  selector:
    matchLabels:
      app: api-server
  template:
    metadata:
      labels:
        app: api-server
    spec:
      containers:
      - name: api
        image: registry.internal/api:v3.0.1
      - name: metrics-exporter
        image: registry.internal/exporter:v0.9.4
