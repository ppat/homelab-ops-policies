---
# EXPECTED: `skip`.
#
# The `metallb-speaker*` exemption, in `metallb-system`. This one has TWO non-vacuity twins,
# because both halves of its predicate are worth pinning separately:
# ./deployment-metallb-controller-fail.yaml (right namespace, wrong name) and
# ./daemonset-metallb-speaker-wrong-namespace-fail.yaml (right name, wrong namespace).
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: metallb-speaker
  namespace: metallb-system
spec:
  selector:
    matchLabels:
      app: metallb-speaker
  template:
    metadata:
      labels:
        app: metallb-speaker
    spec:
      containers:
      - name: main
        image: registry.internal/app:v2.3.0
