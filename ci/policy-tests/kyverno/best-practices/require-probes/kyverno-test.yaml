---
# CLI tier for require-probes. Read ../restrict-node-port/kyverno-test.yaml first -- it is the
# house-style reference and its five numbered conventions all apply here without restating.
#
# This policy is a REDESIGN rather than a port (design doc
# phase2.0-policy-migration-design-v3.md §2.4), so this suite has more to establish than "the rule
# still works". Three things:
#
#   1. THE THREE KINDS ARE MATCHED DIRECTLY. ./deployment-no-probes-fail.yaml,
#      ./daemonset-no-probes-fail.yaml and ./statefulset-no-probes-fail.yaml are one fixture per
#      `matchConstraints` resource entry, with `spec.autogen.podControllers.controllers: []` set
#      in the policy -- so each `fail` is reachable only by the direct match, never by autogen's
#      `object.` -> `object.spec.template.` rewrite. Under the legacy `ClusterPolicy` the rewrite
#      was the ONLY way a controller was reached; these three rows are what makes the difference
#      testable rather than asserted in a comment.
#   2. EVERY EXEMPTION FIRES, AND NONE OF THEM FIRES TOO WIDE. All eight exemption clauses (four
#      namespaces, four name-globs) get a `skip` fixture that is a genuine violation -- an
#      unprobed container -- so `pass` on any of those rows would mean the RULE was weakened
#      rather than the exemption applied. Because `best-practices` policies keep exemptions inline
#      (design §2.1), there is no exemption-free "pure" artifact to run the same fixtures against,
#      the way ../../restricted/restrict-volume-types/kyverno-test.yaml does. The non-vacuity
#      discipline is met instead by NEAR-MISS TWINS: ./deployment-cert-manager-webhook-fail.yaml
#      (right namespace, wrong name), ./deployment-metallb-controller-fail.yaml (right namespace,
#      wrong name) and ./daemonset-metallb-speaker-wrong-namespace-fail.yaml (right name, wrong
#      namespace) are identically-shaped violations that must still fail. A `matchCondition` that
#      widened to a whole namespace, or narrowed to a bare name glob, turns one of them green.
#   3. THE `generateName` TERM IS LIVE. ./generatename-only-deployment-skip.yaml carries
#      `generateName` and no `name`, so it is reachable only through the `+ ?generateName` half of
#      each exemption expression.
#
# THE ONE ASSERTION THIS TIER CANNOT MAKE, stated here because its absence would otherwise look
# like an oversight in the suite that matters most:
#
#   The redesign's headline effect is that a BARE POD is no longer matched at all. `kyverno test`
#   cannot express that. A `results[]` row naming a resource that produced no result is reported
#   "Not found" and fails, and every result value the CLI accepts (`pass`/`fail`/`skip`/`warn`/
#   `error`) presupposes that a result exists; `notfound`, `notFound`, `nomatch` and an omitted
#   `resources:` selector were all measured against the pinned CLI v1.18.2 and all fail. Design
#   §6.2 assigns "validation rule semantics" to this tier, but "this kind is not matched" is
#   outside the tier's vocabulary, not merely unwritten here.
#
#   So ./pod-bare-no-probes-unmatched.yaml is deliberately absent from `resources:` below and
#   carries the `kyverno apply` command that asserts it by hand, with the expected output. The
#   durable home for that assertion is the Chainsaw tier -- an unprobed bare Pod ADMITTED while
#   the policy is patched to `[Deny]` -- which design §6.5 does not currently allocate to this
#   policy. Worth revisiting when the Chainsaw tier next grows.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: require-probes
policies:
- ../../../.build/best-practices/require-probes.yaml
resources:
- deployment-no-probes-fail.yaml
- daemonset-no-probes-fail.yaml
- statefulset-no-probes-fail.yaml
- deployment-all-probe-kinds-pass.yaml
- deployment-ns-csi-driver-nfs-skip.yaml
- daemonset-ns-kube-system-skip.yaml
- statefulset-ns-longhorn-system-skip.yaml
- deployment-ns-system-upgrade-skip.yaml
- deployment-cert-manager-cainjector-skip.yaml
- deployment-cert-manager-webhook-fail.yaml
- daemonset-intel-gpu-plugin-skip.yaml
- daemonset-metallb-speaker-skip.yaml
- deployment-metallb-controller-fail.yaml
- daemonset-metallb-speaker-wrong-namespace-fail.yaml
- statefulset-virt-launcher-sandbox-talos-skip.yaml
- deployment-virt-launcher-sandbox-docker-skip.yaml
- generatename-only-deployment-skip.yaml
results:
# ------------------------------------------------------------------------------------------
# Point 1: each of the three matched kinds, flagged by the direct match. Plus the two near-miss
# Deployments from point 2, which share this row because the assertion is identical.
- policy: require-probes
  isValidatingPolicy: true
  kind: Deployment
  resources:
  - default/api-server
  - cert-manager/cert-manager-webhook
  - metallb-system/metallb-controller
  result: fail
- policy: require-probes
  isValidatingPolicy: true
  kind: DaemonSet
  resources:
  - default/log-collector
  - default/metallb-speaker
  result: fail
- policy: require-probes
  isValidatingPolicy: true
  kind: StatefulSet
  resources:
  - default/postgres
  result: fail
# ------------------------------------------------------------------------------------------
# The compliant controller. `pass`, not `skip`: it was evaluated and satisfied the rule. Three
# containers, one per probe kind, so dropping any disjunct from the policy turns this row red.
- policy: require-probes
  isValidatingPolicy: true
  kind: Deployment
  resources:
  - default/well-probed
  result: pass
# ------------------------------------------------------------------------------------------
# Point 2: the eight exemption clauses firing, split by kind only because `kind:` is part of the
# row. `skip`, NEVER `pass` -- every one of these controllers has an unprobed container, so a
# `pass` would mean the rule had been weakened rather than the exemption applied. Declaring
# `pass` here makes the suite fail with "Want pass, got skip", which is what makes the
# distinction observable in this tier at all.
#
# `metallb-system/` -- namespace, slash, EMPTY name -- addresses the generateName-only fixture
# (point 3). It is the only selector form that reaches a resource with no `metadata.name`.
- policy: require-probes
  isValidatingPolicy: true
  kind: Deployment
  resources:
  - csi-driver-nfs/nfs-node-driver
  - system-upgrade/system-upgrade-controller
  - cert-manager/cert-manager-cainjector
  - sandbox-docker/virt-launcher-docker-vm
  - metallb-system/
  result: skip
- policy: require-probes
  isValidatingPolicy: true
  kind: DaemonSet
  resources:
  - kube-system/kube-proxy-shim
  - intel-device-plugins/intel-gpu-plugin-gpu-device-plugin
  - metallb-system/metallb-speaker
  result: skip
- policy: require-probes
  isValidatingPolicy: true
  kind: StatefulSet
  resources:
  - longhorn-system/longhorn-engine-manager
  - sandbox-talos/virt-launcher-talos-vm
  result: skip
