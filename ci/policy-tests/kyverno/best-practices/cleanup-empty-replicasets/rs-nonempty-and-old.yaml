---
# NOT A CANDIDATE: old enough but not empty. Falsifies is-empty -- without it, a policy mis-edited
# to delete anything old would still show green.
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: nonempty-old-replicaset
  namespace: default
  creationTimestamp: "2020-01-01T00:00:00Z"
spec:
  replicas: 3
  selector:
    matchLabels: {app: nonempty-old-replicaset}
  template:
    metadata: {labels: {app: nonempty-old-replicaset}}
    spec:
      containers:
      - name: c
        image: registry.k8s.io/pause:3.10
