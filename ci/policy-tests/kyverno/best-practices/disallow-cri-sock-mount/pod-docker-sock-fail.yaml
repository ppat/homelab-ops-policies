---
# EXPECTED: `fail` -- "Use of the Docker Unix socket is not allowed."
#
# The canonical violation: the dockerd socket bind-mounted straight into a container.
apiVersion: v1
kind: Pod
metadata:
  name: docker-sock-consumer
  namespace: kube-system
spec:
  containers:
  - name: agent
    image: registry.internal/agent:v1.4.0
    volumeMounts:
    - name: docker-sock
      mountPath: /var/run/docker.sock
  volumes:
  - name: docker-sock
    hostPath:
      path: /var/run/docker.sock
      type: Socket
