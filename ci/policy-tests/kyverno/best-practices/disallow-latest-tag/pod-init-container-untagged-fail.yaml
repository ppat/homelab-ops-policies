---
# EXPECTED: `fail` ("An image tag is required.").
#
# The untagged case on `initContainers`, so that BOTH `validations[]` entries -- not just the
# `:latest` one -- are proven to iterate all three lists. Without this, a mis-edit that restored
# upstream's `object.spec.containers` on the first entry only would still leave the suite green.
apiVersion: v1
kind: Pod
metadata:
  name: untagged-init
  namespace: default
spec:
  initContainers:
  - name: migrate
    image: registry.internal/migrator
  containers:
  - name: app
    image: registry.internal/app:v2.3.0
