---
apiVersion: v1
kind: Pod
metadata:
  name: runtime-default-workload
  namespace: default
spec:
  restartPolicy: Always
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: ghcr.io/example/app:1.0.0
    securityContext:
      seccompProfile:
        type: Localhost
        localhostProfile: profiles/audit.json
