---
# CLI tier for disallow-host-ports. Read
# ../../restricted/restrict-volume-types/kyverno-test.yaml first -- it is the house-style
# reference for the two-document (`-built`/`-pure`) shape and for why either half alone is
# vacuous.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-host-ports-built
policies:
- ../../../.build/baseline/disallow-host-ports.yaml
resources:
- pod-no-hostport-pass.yaml
- pod-hostport-fail.yaml
- pod-metallb-speaker-hostport-skip.yaml
- pod-node-exporter-hostport-skip.yaml
- pod-not-metallb-speaker-in-metallb-system-hostport-fail.yaml
- pod-not-node-exporter-in-monitoring-hostport-fail.yaml
results:
- policy: disallow-host-ports
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/ordinary-workload
  result: pass
# The last two resources are the NAME-axis controls for exempt-metallb-speaker and
# exempt-node-exporter: same namespace as their respective skip fixture below, a name each
# exemption's prefix does not match. See pod-not-metallb-speaker-in-metallb-system-hostport-fail.yaml
# and pod-not-node-exporter-in-monitoring-hostport-fail.yaml.
- policy: disallow-host-ports
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/hostport-workload
  - metallb-system/metallb-controller-8f6b7c9d5-vhqtz
  - monitoring/kube-prometheus-stack-prometheus-0
  result: fail
- policy: disallow-host-ports
  isValidatingPolicy: true
  kind: Pod
  resources:
  - metallb-system/metallb-speaker-9k2vq
  - monitoring/kube-prometheus-stack-prometheus-node-exporter-7g4hj
  result: skip
---
# The exemption layer removed. Same fixtures; only `policies:` differs, and the two exemption
# fixtures assert `fail` instead of `skip` -- the firing assertion.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: disallow-host-ports-pure
policies:
- ../../../../../pod-security-standard/baseline/disallow-host-ports.yaml
resources:
- pod-no-hostport-pass.yaml
- pod-hostport-fail.yaml
- pod-metallb-speaker-hostport-skip.yaml
- pod-node-exporter-hostport-skip.yaml
- pod-not-metallb-speaker-in-metallb-system-hostport-fail.yaml
- pod-not-node-exporter-in-monitoring-hostport-fail.yaml
results:
- policy: disallow-host-ports
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/ordinary-workload
  result: pass
- policy: disallow-host-ports
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/hostport-workload
  - metallb-system/metallb-speaker-9k2vq
  - monitoring/kube-prometheus-stack-prometheus-node-exporter-7g4hj
  - metallb-system/metallb-controller-8f6b7c9d5-vhqtz
  - monitoring/kube-prometheus-stack-prometheus-0
  result: fail
