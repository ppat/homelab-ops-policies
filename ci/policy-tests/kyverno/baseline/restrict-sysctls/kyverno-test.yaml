---
# CLI tier for restrict-sysctls. Read
# ../../best-practices/restrict-node-port/kyverno-test.yaml first -- it is the house-style
# reference and its five numbered conventions all apply here without restating. Single `Test`
# document: this policy carries no estate exemptions (design §3.1), so built output and the pure
# mirror are identical.
#
# pod-new-safe-sysctls.yaml's expected result tracks which commit is checked out -- see that
# fixture's own header. It reads `fail` on the structural kind-migration commit and `pass` once
# the 5->12 content-delta commit lands on the same PR.
apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: restrict-sysctls
policies:
- ../../../.build/baseline/restrict-sysctls.yaml
resources:
- pod-unset-pass.yaml
- pod-legacy-allowed-pass.yaml
- pod-disallowed-sysctl-fail.yaml
- pod-new-safe-sysctls.yaml
results:
- policy: restrict-sysctls
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/ordinary-workload
  - default/legacy-allowed-workload
  result: pass
- policy: restrict-sysctls
  isValidatingPolicy: true
  kind: Pod
  resources:
  - default/disallowed-sysctl-workload
  - default/new-safe-sysctls-workload
  result: fail
