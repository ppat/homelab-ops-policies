---
apiVersion: v1
kind: Pod
metadata:
  name: legacy-allowed-workload
  namespace: default
spec:
  restartPolicy: Always
  securityContext:
    sysctls:
    - name: kernel.shm_rmid_forced
      value: "1"
    - name: net.ipv4.ping_group_range
      value: "0 2147483647"
  containers:
  - name: app
    image: ghcr.io/example/app:1.0.0
