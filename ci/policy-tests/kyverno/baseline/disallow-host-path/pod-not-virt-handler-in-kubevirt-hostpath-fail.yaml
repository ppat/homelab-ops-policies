kind: Pod
metadata:
  name: virt-api-6794fd7fd6-9429f
  namespace: kubevirt
spec:
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    volumeMounts:
    - name: host-root
      mountPath: /host
      readOnly: true
  volumes:
  - name: host-root
    hostPath:
      path: /
