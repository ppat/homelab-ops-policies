---
# EXPECTED: `fail`.
#
# THE LOAD-BEARING CONTROL OF THIS DIRECTORY: without it the `pass` rows could be produced by a
# policy that had stopped objecting to anything.
#
# READ BEFORE PROMOTING THIS FIXTURE TO THE CLUSTER TIER: a 1.36 apiserver REJECTS this pod
# outright. `pkg/apis/core/validation/validation.go`'s `ValidateSecurityContext()` refuses
# `procMount: Unmasked` unless `spec.hostUsers` is false, with no feature-gate guard on the
# branch, so this shape cannot be created on a live cluster at all. It remains a valid CLI-tier
# fixture -- this tier runs the policy engine, not apiserver validation -- and it is the only
# thing that proves the rule is non-vacuous. A Chainsaw test cannot construct it.
apiVersion: v1
kind: Pod
metadata:
  name: ordinary-workload-5f7d9b46c-tn4wq
  namespace: default
spec:
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    securityContext:
      procMount: Unmasked
