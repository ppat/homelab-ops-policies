---
# EXPECTED: `skip`.
#
# THE NON-VACUITY CONTROL FOR THE RELAXATION ITSELF: a user-namespaced pod that is COMPLIANT
# anyway. It reports `skip`, not `pass`, because the matchCondition filters it out before the
# rule runs -- which is what proves the skip is caused by `hostUsers`, not by the pod's procMount
# value. Its sibling ../../restricted/disallow-proc-mount-strict/ (Wave E6) asserts `pass` on
# this same shape, and that Skip/Pass pair is how PSS's `OverrideCheckIDs` resolution between
# procMount_baseline and procMount_restricted becomes an executable claim.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-userns-workload-fd4b5c598-pv8pn
  namespace: default
spec:
  hostUsers: false
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    securityContext:
      procMount: Default
