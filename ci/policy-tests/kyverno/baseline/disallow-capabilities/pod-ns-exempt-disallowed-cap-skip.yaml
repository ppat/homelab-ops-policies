---
# EXPECTED: `skip` against the built policy, `fail` against the pure mirror.
#
# FIRING FIXTURE for the exempt-namespaces matchCondition (design doc
# phase2.0-policy-migration-design-v3.md §2.5) -- one representative of the shared
# csi-driver-nfs/longhorn-system/metallb-system/system-upgrade/tailscale exclusion set. The
# `fail` result against the pure mirror proves this pod IS a genuine violation (SYS_ADMIN is not
# on the allow-list), so the `skip` against the built policy can only be coming from the
# exemption patch.
apiVersion: v1
kind: Pod
metadata:
  name: csi-nfs-controller-6f9b8d5c7-abcde
  namespace: csi-driver-nfs
spec:
  restartPolicy: Always
  containers:
  - name: csi-driver
    image: ghcr.io/example/csi-driver-nfs:1.0.0
    securityContext:
      capabilities:
        add:
        - SYS_ADMIN
