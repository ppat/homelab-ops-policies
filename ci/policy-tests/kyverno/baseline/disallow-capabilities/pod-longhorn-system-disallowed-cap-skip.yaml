---
# EXPECTED: `skip` against the built policy, `fail` against the pure mirror.
#
# One of five fixtures, one per namespace in the `exempt-namespaces` list -- without a fixture of
# its own a namespace can be dropped from that list and this suite stays green.
apiVersion: v1
kind: Pod
metadata:
  name: longhorn-manager-rg2fl
  namespace: longhorn-system
spec:
  restartPolicy: Always
  containers:
  - name: longhorn-manager
    image: ghcr.io/example/longhorn-manager:1.0.0
    securityContext:
      capabilities:
        add:
        - SYS_ADMIN
