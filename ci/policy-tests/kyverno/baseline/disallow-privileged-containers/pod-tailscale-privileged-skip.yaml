---
# EXPECTED: `skip` against the built policy, `fail` against the pure mirror.
#
# Fires `exempt-node-level-namespaces`, FIFTH member -- the one this policy has and ../disallow-host-path/
# does not. The two namespace lists are deliberately different lengths (tailscale needs privileged mode for
# /dev/net/tun, not a host path), so this fixture has no counterpart there and that asymmetry is intentional.
apiVersion: v1
kind: Pod
metadata:
  name: ts-homelab-bmjbv-0
  namespace: tailscale
spec:
  containers:
  - name: app
    image: registry.k8s.io/pause:3.10
    securityContext:
      privileged: true
